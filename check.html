<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your closed testing links — ACT Party</title>
<meta name="description" content="Paste your Google Group and opt-in link. We check from outside, the way a tester sees them. The owner's own account always looks fine — that is why broken links go unnoticed.">
<link rel="canonical" href="https://actparty.app/check.html">
<meta property="og:title" content="Check your closed testing links">
<meta property="og:description" content="Your group and opt-in links look fine to you because you are the owner. Check them the way a tester sees them.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/assets/app.css?v=100">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><span class="dot">ACT</span> ACT Party</a>
    <nav>
      <a href="/launched.html" data-t="nav_launched">Launched</a>
      <a href="/parties.html" data-t="nav_party">Parties</a>
      <a href="/community.html" data-t="nav_board">Board</a>
      <a href="/how.html" data-t="nav_how">What is ACT Party?</a>
      <a href="/check.html" class="active" data-t="nav_check">Link check</a>
      <span id="authSlot"></span>
      <span id="langSlot"></span>
    </nav>
  </div>
</header>

<div class="wrap narrow" style="padding-top:30px">

  <h1 style="font-size:27px;margin:0 0 10px" data-t="chk_h">Check your tester links</h1>
  <p class="lead" data-t="chk_lead"></p>

  <!-- 주인 계정으로는 무엇을 해도 정상으로 보인다. 이 한 줄이 이 페이지의 이유다. -->
  <div class="note warn" style="margin:18px 0 26px">
    <p style="margin:0" data-t="chk_owner_warn"></p>
  </div>

  <!-- ── 1. 그룹 ─────────────────────────────────────────────
       밖에서 익명으로 열어 보면 판별된다. 이건 기계가 대신 해 준다. -->
  <h2 style="margin:0 0 4px;font-size:19px" data-t="chk_g_h">1. Google Group link</h2>
  <p class="muted" style="margin:0 0 10px" data-t="chk_g_sub"></p>
  <div class="row">
    <input type="url" id="g" style="flex:1;min-width:240px"
           placeholder="https://groups.google.com/g/my-testers">
    <button class="btn" id="gbtn" data-t="chk_btn">Check</button>
  </div>
  <p class="hint" id="gmsg"></p>
  <div id="gfix" hidden style="margin-top:12px"></div>

  <!-- ── 2. 옵트인 ───────────────────────────────────────────
       구글은 로그인 전에 아무것도 알려주지 않는다. 없는 패키지도 똑같이
       로그인 화면으로 보낸다. 그래서 여기는 사람이 직접 봐야 한다. -->
  <h2 style="margin:38px 0 4px;font-size:19px" data-t="chk_o_h">2. Opt-in link</h2>
  <p class="muted" style="margin:0 0 10px" data-t="chk_o_sub"></p>
  <div class="row">
    <input type="url" id="o" style="flex:1;min-width:240px"
           placeholder="https://play.google.com/apps/testing/com.example.app">
    <a class="btn ghost" id="obtn" target="_blank" rel="noopener noreferrer"
       data-t="chk_o_open">Open it</a>
  </div>
  <p class="hint" id="omsg"></p>

  <h3 style="margin:22px 0 8px;font-size:15px" data-t="chk_q">What did the page say?</h3>
  <div class="row" id="ans">
    <button class="btn ghost sm" data-v="ok" data-t="chk_a_ok">The app name showed up</button>
    <button class="btn ghost sm" data-v="na" data-t="chk_a_na">App not available</button>
    <button class="btn ghost sm" data-v="store" data-t="chk_a_store">Store: item not found</button>
    <button class="btn ghost sm" data-v="country" data-t="chk_a_country">Not in your country</button>
  </div>
  <div id="ofix" hidden style="margin-top:14px"></div>

  <div class="card" style="margin:40px 0 10px;display:flex;gap:14px;
       align-items:center;justify-content:space-between;flex-wrap:wrap">
    <div>
      <h3 style="margin:0 0 2px" data-t="cta_reg_h">Looking for testers?</h3>
      <p class="muted" style="margin:0" data-t="chk_cta_p"></p>
    </div>
    <a class="btn" href="/console.html?new=1" data-t="register_app">Register an app</a>
  </div>
</div>

<footer class="bot"><div class="wrap">
  <p><a href="/">Home</a> · <a href="/guides/" data-t="nav_guides">Guides</a>
     · <a href="/privacy.html" data-t="privacy">Privacy</a></p>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { checkGroup, mountAuth } from '/assets/api.js?v=100';
import { t, applyDom, langPicker, wireLangPicker } from '/assets/i18n.js?v=100';

document.getElementById('langSlot').innerHTML = langPicker();
applyDom();
wireLangPicker();
mountAuth('authSlot', t);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 문제마다 "왜 그런지 + 무엇을 누르면 되는지 + 자세한 가이드"를 바로 밑에 편다.
// 링크만 주면 안 눌러 본다 — 고칠 단계가 그 자리에 보여야 고친다.
function fixBox(key, href) {
  const steps = t(key + '_s').split('\n').filter(Boolean);
  return `<div class="note warn">
    <p style="margin:0 0 6px;font-weight:700">${t(key + '_h')}</p>
    <p style="margin:0 0 8px">${t(key + '_p')}</p>
    <ol style="margin:0 0 8px;padding-left:20px">${
      steps.map((s) => `<li style="margin:2px 0">${s}</li>`).join('')}</ol>
    <p style="margin:0"><a href="${href}">${t('chk_more')}</a></p>
  </div>`;
}

// ── 그룹 ──
const groupNow = async () => {
  const v = $('g').value.trim();
  $('gfix').hidden = true;
  if (!v) { $('gmsg').textContent = ''; return; }
  $('gmsg').className = 'hint';
  $('gmsg').textContent = '…';
  try {
    const r = await checkGroup(v);
    $('gmsg').className = 'hint ' + (r?.ok ? 'ok' : 'bad');
    $('gmsg').innerHTML = r?.ok
      ? `✓ ${esc(r.title)} — ${t('chk_g_ok')}`
      : `⚠ ${t('chk_g_bad')}`;
    if (!r?.ok) {
      $('gfix').innerHTML = fixBox('chk_f_group', '/guides/google-group.html');
      $('gfix').hidden = false;
    }
  } catch (_) {
    $('gmsg').className = 'hint';
    $('gmsg').textContent = t('chk_err');
  }
};
$('gbtn').onclick = groupNow;
$('g').addEventListener('blur', groupNow);
$('g').addEventListener('keydown', (e) => { if (e.key === 'Enter') groupNow(); });

// ── 옵트인 ──
// 서버에서는 판별이 안 된다. 주소 모양과 패키지명만 봐 주고, 실제 판정은
// 사람이 다른 계정으로 열어 본 결과로 받는다.
const PKG = /play\.google\.com\/apps\/testing\/([A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)+)/;
const optinNow = () => {
  const v = $('o').value.trim();
  const btn = $('obtn');
  if (!v) { $('omsg').textContent = ''; btn.removeAttribute('href'); return; }
  const m = v.match(PKG);
  if (!m) {
    $('omsg').className = 'hint bad';
    $('omsg').innerHTML = `⚠ ${t('chk_o_bad')}`;
    btn.removeAttribute('href');
    return;
  }
  $('omsg').className = 'hint ok';
  $('omsg').innerHTML = `✓ ${t('chk_o_fmt')} — <code>${esc(m[1])}</code>`;
  btn.href = `https://play.google.com/apps/testing/${m[1]}`;
};
$('obtn').onclick = (e) => { if (!e.currentTarget.getAttribute('href')) e.preventDefault(); };
$('o').addEventListener('input', optinNow);
$('o').addEventListener('paste', () => setTimeout(optinNow, 30));

const ANSWERS = {
  ok: null,
  na: ['chk_f_na', '/guides/blocked-screens.html'],
  store: ['chk_f_store', '/guides/blocked-screens.html'],
  country: ['chk_f_country', '/guides/country-availability.html'],
};
$('ans').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  for (const x of $('ans').querySelectorAll('button')) x.classList.add('ghost');
  b.classList.remove('ghost');
  const hit = ANSWERS[b.dataset.v];
  $('ofix').innerHTML = hit
    ? fixBox(hit[0], hit[1])
    : `<p class="hint ok">✓ ${t('chk_f_ok')}</p>`;
  $('ofix').hidden = false;
});
</script>
</body>
</html>
