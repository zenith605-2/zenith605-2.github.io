<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parties — ACT Party</title>
<meta name="description" content="Group testing: a dozen developers test each other's apps at once, instead of arranging twelve one-to-one trades.">
<link rel="canonical" href="https://actparty.app/parties.html">
<link rel="stylesheet" href="/assets/app.css?v=73">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><span class="dot">ACT</span> ACT Party</a>
    <nav>
      <a href="/launched.html" data-t="nav_launched">Launched</a>
      <a href="/parties.html" class="active" data-t="nav_party">Parties</a>
      <a href="/community.html" data-t="nav_board">Board</a>
      <a href="/how.html" data-t="nav_how">What is ACT Party?</a>
      <span id="authSlot"></span>
      <span id="langSlot"></span>
    </nav>
  </div>
</header>

<div class="wrap" id="board" style="padding-top:24px">
  <div id="root"><p class="muted" data-t="loading">Loading…</p></div>
</div>

<footer class="bot"><div class="wrap">
  <p><a href="/">Home</a> · <a href="/guides/" data-t="nav_guides">Guides</a>
     · <a href="/privacy.html" data-t="privacy">Privacy</a></p>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { me, signIn, esc, ago, mountAuth, myApps,
         openParties, joinParty, leaveParty, createParty } from '/assets/api.js?v=73';
import { t, applyDom, langPicker, wireLangPicker } from '/assets/i18n.js?v=73';

document.getElementById('langSlot').innerHTML = langPicker();
applyDom();
wireLangPicker();
mountAuth('authSlot', t);

const root = document.getElementById('root');
let ME = null, MINE = [], ROWS = [];

ME = await me().catch(() => null);
if (ME) MINE = await myApps().catch(() => []);

const ST = (s) => t({ forming: 'st_forming', locked: 'st_locked',
                      running: 'st_running' }[s] || 'st_done');

async function load() { ROWS = await openParties().catch(() => []); }

function list() {
  root.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end;gap:12px">
      <div>
        <h1 style="font-size:22px;margin:0 0 2px" data-t="party_h">Parties</h1>
        <p class="muted" style="margin:0;max-width:60ch" data-t="party_p"></p>
      </div>
      ${ME ? `<button class="btn" id="newParty">＋ ${t('party_new')}</button>`
           : `<button class="btn" id="loginBtn">${t('sign_in')}</button>`}
    </div>

    <div class="grid" style="margin-top:18px">${ROWS.length ? ROWS.map((p) => `
      <div class="card">
        <p class="app-name">${esc(p.name || '')}
          <span class="tag ${p.status === 'running' ? 'mint' : 'sky'}">${ST(p.status)}</span>
          ${p.has_password ? `<span class="tag">🔒</span>` : ''}</p>
        <p class="muted who">${esc(p.leader_name || t('developer'))} · ${ago(p.created_at)}
          <span class="sep">·</span>
          <span class="dim">${t('party_cap')} ${p.members}/${p.capacity}</span>
          ${p.min_karma > 0 ? `<span class="sep">·</span>
            <span class="dim">${t('party_minkarma')} ${p.min_karma}</span>` : ''}</p>
        <p class="cardact" style="margin-top:12px">${
          !ME ? `<span class="muted">${t('offer_login')}</span>`
          : p.i_am_in
            ? `<span class="state on">✓ ${t('party_in')}</span>
               <button class="btn ghost sm" data-leave="${p.id}">${t('party_leave')}</button>`
            : p.members >= p.capacity
              ? `<span class="state">${t('t_closed')}</span>`
              : `<button class="btn sm" data-join="${p.id}"
                   data-pw="${p.has_password ? 1 : 0}">${t('party_join')}</button>`}</p>
      </div>`).join('') : `<p class="muted">${t('party_none')}</p>`}</div>`;

  applyDom();
  const n = document.getElementById('newParty');
  if (n) n.onclick = form;
  const l = document.getElementById('loginBtn');
  if (l) l.onclick = () => signIn().catch((e) => alert(e.message));

  root.querySelectorAll('[data-join]').forEach((b) => {
    b.onclick = async () => {
      if (!MINE.length) { alert(t('no_apps')); return; }
      // 파티는 내 앱 하나를 들고 들어가는 자리다. 어느 앱인지 정해야 한다.
      const appId = MINE.length === 1 ? MINE[0].id : pickApp();
      if (!appId) return;
      const pw = b.dataset.pw === '1' ? prompt(t('party_pw')) : null;
      if (b.dataset.pw === '1' && !pw) return;
      b.disabled = true;
      try { await joinParty(b.dataset.join, appId, pw); await load(); list(); }
      catch (e) { alert(e.message || e); b.disabled = false; }
    };
  });
  root.querySelectorAll('[data-leave]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try { await leaveParty(b.dataset.leave); await load(); list(); }
      catch (e) { alert(e.message || e); b.disabled = false; }
    };
  });
}

function pickApp() {
  const names = MINE.map((m, i) => `${i + 1}. ${m.name}`).join('\n');
  const n = prompt(`${t('party_pick')}\n${names}`, '1');
  const i = Number(n) - 1;
  return MINE[i]?.id || null;
}

function form() {
  root.insertAdjacentHTML('afterbegin', `
    <div class="card" id="pForm" style="margin-bottom:16px">
      <h2 style="font-size:17px;margin:0 0 10px">${t('party_new')}</h2>
      <label>${t('title')} <span class="req">${t('req')}</span></label>
      <input type="text" id="pName" maxlength="40">
      <div class="row" style="gap:16px;align-items:flex-end">
        <div style="width:120px">
          <label>${t('party_cap')}</label>
          <input type="text" id="pCap" value="12" inputmode="numeric">
        </div>
        <div style="width:150px">
          <label>${t('party_minkarma')}</label>
          <input type="text" id="pKarma" value="0" inputmode="numeric">
        </div>
      </div>
      <label>${t('party_pw')} <span class="muted">${t('optional_h')}</span></label>
      <input type="text" id="pPw">
      <p class="hint">${t('party_pw_opt')}</p>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="pSave">${t('party_new')}</button>
        <button class="btn ghost" id="pCancel">${t('cancel')}</button>
      </div>
    </div>`);
  document.getElementById('pCancel').onclick = () => document.getElementById('pForm').remove();
  document.getElementById('pSave').onclick = async (ev) => {
    const name = document.getElementById('pName').value.trim();
    if (!name) { alert(t('need_title')); return; }
    if (!MINE.length) { alert(t('no_apps')); return; }
    const appId = MINE.length === 1 ? MINE[0].id : pickApp();
    if (!appId) return;
    ev.target.disabled = true;
    try {
      await createParty(name,
        (document.documentElement.lang || 'en').split('-')[0],
        Math.max(2, Math.min(50, Number(document.getElementById('pCap').value) || 12)),
        Math.max(0, Number(document.getElementById('pKarma').value) || 0),
        appId,
        document.getElementById('pPw').value.trim() || null);
      await load(); list();
    } catch (e) { alert(e.message || e); ev.target.disabled = false; }
  };
}

await load();
list();
</script>
</body>
</html>
