<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>안내 음성 후보</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:24px}
  h1{font-size:32px}
  .row{background:#222;border-radius:14px;padding:16px 18px;margin:12px 0}
  .row h2{font-size:22px;margin:0 0 10px}
  button{font-size:22px;padding:14px 18px;border-radius:12px;border:0;background:#3a6df0;color:#fff;margin:6px 8px 0 0}
  p{opacity:.75;font-size:18px}
</style>
</head>
<body>
<main>
<h1>안내 음성 후보 (맥 기본 음성 유나)</h1>
<p>시험용입니다. 실제 판은 더 자연스러운 AI 음성으로 바꿀 수 있습니다.</p>
<div class="row"><h2>보통 빠르기</h2>
  <button data-f="s180_a">카메라 안내</button><button data-f="s180_b">속도를 줄이세요</button><button data-f="s180_c">구간단속</button></div>
<div class="row"><h2>빠르게</h2>
  <button data-f="s220_a">카메라 안내</button><button data-f="s220_b">속도를 줄이세요</button><button data-f="s220_c">구간단속</button></div>
<p id="st"></p>
</main>
<script>
var a=new Audio();
document.querySelectorAll('button').forEach(function(b){b.onclick=function(){var t0=performance.now();a.src='voice/'+b.dataset.f+'.m4a';a.onplaying=function(){document.getElementById('st').textContent='재생 시작까지 '+Math.round(performance.now()-t0)+'ms'};a.play().catch(function(e){document.getElementById('st').textContent='재생 오류: '+e.message})}});
</script>
</body>
</html>
