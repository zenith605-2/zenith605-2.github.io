<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>카메라 경고 시험판</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#f3efe6;color:#111;font-family:system-ui,sans-serif;overflow:hidden}
  #map{position:fixed;left:0;right:0;top:0;bottom:78px}
  body.nomap{background:#15181d;color:#fff}
  body.nomap #map,body.nomap #carMk,body.nomap #zoomGrp,body.nomap #prog{display:none}
  #carMk{position:fixed;left:50%;top:calc((100% - 78px)*0.68);width:64px;height:64px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 6px #0006);z-index:3;pointer-events:none;color:#e9e9e9}
  #carMk svg{width:100%;height:100%}
  #warn{position:fixed;inset:0;pointer-events:none;z-index:4}
  body.over #warn{box-shadow:inset 0 0 0 24px #ff1a1a;background:#ff000030;animation:blink .55s steps(2,jump-none) infinite}
  body.zone:not(.over) #warn{box-shadow:inset 0 0 0 12px #ffcc00}
  @keyframes blink{0%{opacity:1}100%{opacity:.12}}

  #left{position:fixed;left:0;top:0;z-index:5;display:flex;flex-direction:column;align-items:flex-start}
  #turn{display:none;background:#17643f;color:#fff;border-bottom-right-radius:14px;padding:14px 26px 14px 18px;align-items:center;gap:18px;min-width:380px;box-shadow:0 4px 14px #0004}
  body.nav #turn{display:flex}
  #tArrow{width:92px;height:92px;flex:none}
  #tDist{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
  #tDist small{font-size:34px;font-weight:700;margin-left:2px}
  #tName{font-size:24px;margin-top:6px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #next{display:none;background:#0f4a2e;color:#fff;border-bottom-right-radius:12px;padding:8px 18px;align-items:center;gap:12px;font-size:36px;font-weight:800;box-shadow:0 4px 14px #0004}
  body.nav #next.show{display:flex}
  #nArrow{width:44px;height:44px}

  #alertBox{position:fixed;left:24px;bottom:96px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px}
  #signWrap{position:relative;width:118px;height:118px;display:none}
  #alertBox.on #signWrap{display:block}
  .lim{position:absolute;inset:0;border-radius:50%;background:#fff;border:15px solid #e3151a;box-sizing:border-box;color:#111;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0005}
  .lim.z{box-shadow:0 0 0 6px #ffcc00,0 3px 10px #0005}
  #sgChild,#sgSig{position:absolute;display:none}
  #sgChild{width:56px;height:52px;right:-22px;top:-14px}
  #sgSig{width:62px;height:104px;left:28px;top:7px}
  #alertBox.child #sgChild,#alertBox.sig #sgSig{display:block}
  #alertBox.sig #sgSig{display:none}
  .lim{flex-direction:column}
  .lim b{font-weight:900;line-height:1}
  .tl{display:flex;gap:3px;background:#222;border-radius:7px;padding:3px 5px;margin-bottom:2px}
  .tl i{display:block;width:8px;height:8px;border-radius:50%}
  #alertBox.sx .lim b{font-size:40px}
  #alertBox.sig .tl{transform:scale(1.8)}
  #pill{display:none;background:#e3151a;color:#fff;font-size:34px;font-weight:800;border-radius:8px;padding:2px 14px;min-width:96px;text-align:center;box-shadow:0 3px 10px #0004}
  #alertBox.on #pill{display:block}
  body.over #pill{animation:blink .55s steps(2,jump-none) infinite}
  #tag{display:none;background:#ffc81e;color:#111;font-size:22px;font-weight:800;border-radius:8px;padding:3px 12px;min-width:96px;text-align:center;box-shadow:0 3px 10px #0004;margin-top:-4px}
  #alertBox.on #tag{display:block}
  #alertBox.sec #tag{background:#1f5fd6;color:#fff}
  #spd{margin-bottom:4px;font-size:40px;font-weight:900;line-height:1;margin-top:2px;color:#111;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff}
  body.nomap #alertBox{left:50%;transform:translateX(-50%);bottom:120px}
  body.nomap #spd{color:#fff;text-shadow:none;font-size:110px}
  body.over #spd{color:#e3151a}

  #rightBtns{position:fixed;right:44px;top:50%;transform:translateY(-55%);display:flex;flex-direction:column;gap:14px;z-index:6}
  .rb{width:74px;height:74px;border-radius:50%;border:0;background:#fff;color:#111;box-shadow:0 3px 12px #0003;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600;padding:0}
  .rb svg{width:36px;height:36px}
  #zoomGrp{display:flex;flex-direction:column;gap:14px}
  #prog{position:fixed;right:14px;top:24px;bottom:100px;width:8px;border-radius:4px;background:#2b7bff33;z-index:6;display:none}
  body.nav #prog{display:none}
  #progFill{position:absolute;left:0;right:0;bottom:0;background:#2b7bff;border-radius:4px}
  #progDot{position:absolute;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;border:4px solid #2b7bff;box-sizing:border-box}

  #bottom{position:fixed;left:0;right:0;bottom:0;height:78px;background:#fff;color:#111;border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -2px 12px #0002;z-index:7;display:flex;align-items:center;padding:0 18px;gap:20px}
  #bottom .ic{width:58px;height:58px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
  #bottom .ic svg{width:34px;height:34px}
  #bMid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  #bInfo{display:flex;align-items:baseline;gap:22px;justify-content:center;font-size:20px;white-space:nowrap}
  #tbar{position:relative;width:min(560px,60%);height:14px;border-radius:7px;background:#dfe5ee;display:none;overflow:visible}
  body.nav #tbar{display:block}
  #tbarIn{position:absolute;inset:0;border-radius:7px;overflow:hidden;display:flex}
  #tbarIn i{display:block;height:100%}
  #tbarDone{position:absolute;left:0;top:0;bottom:0;width:0;background:#c9ced6;border-radius:7px 0 0 7px}
  #tbarDot{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:4px solid #2b7bff;box-sizing:border-box;left:0}
  body.nav #bottom{height:92px}
  body.nav #map{bottom:92px}
  #bInfo b{font-size:36px;font-weight:800}
  #bInfo .gray{color:#888;font-size:22px}
  #reroute{visibility:hidden}
  body.nav #reroute{visibility:visible}
  #diag{position:fixed;right:130px;bottom:86px;font-size:12px;color:#333;opacity:.75;text-align:right;white-space:pre;z-index:6;text-shadow:0 0 3px #fff}

  #fav{position:fixed;left:0;right:0;bottom:78px;z-index:8;background:#fff;color:#111;border-top-left-radius:22px;border-top-right-radius:22px;box-shadow:0 -4px 18px #0003;padding:10px 22px 18px;transform:translateY(calc(100% + 120px));transition:transform .35s ease;visibility:hidden}
  #fav.show{transform:none;visibility:visible}
  #fav .hd{display:flex;align-items:center;gap:10px}
  #fav .hd b{font-size:22px;flex:1}
  #fav .hd button{border:0;background:#eef1f5;border-radius:10px;font-size:18px;padding:8px 14px}
  #fav .grip{width:60px;height:6px;border-radius:3px;background:#d4d8de;margin:0 auto 10px}
  #favList{display:flex;gap:12px;overflow-x:auto;padding-top:10px}
  .fc{flex:none;min-width:190px;max-width:260px;background:#f1f5fb;border-radius:16px;padding:16px 18px;text-align:left;border:0;color:#111}
  .fc .k{font-size:15px;font-weight:800;color:#2b7bff}
  .fc .n{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fc .d{font-size:15px;color:#666;margin-top:4px}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts button{font-size:16px;border:0;border-radius:10px;padding:8px 12px;background:#e3e8ef;color:#111}
  .rt{background:#f1f5fb;border-radius:16px;padding:16px 18px;margin:12px 0;cursor:pointer}
  .rt:first-child{outline:3px solid #2b7bff}
  .rt .rk{font-size:16px;font-weight:800;color:#2b7bff}
  .rt .rm{font-size:20px;margin-top:4px}.rt .rm b{font-size:30px}
  .rt .rs{font-size:16px;color:#666;margin-top:2px}
  .rt .tb{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:#dfe5ee}.rt .tb i{display:block;height:100%}
  .band{background:#fff;border:1px solid #e6e9ee;border-radius:18px;margin:12px 0;overflow:hidden}
  .band .bt{color:#2b7bff;font-weight:800;font-size:20px;padding:16px 18px;border-bottom:1px solid #eef0f3}
  .band .row{display:flex;align-items:center;padding:16px 18px;font-size:21px;border-bottom:1px solid #eef0f3;cursor:pointer}
  .band .row:last-child{border-bottom:0}
  .band .row span{flex:1}.band .row i{color:#2b7bff;font-style:normal;font-size:24px;font-weight:800}
  .sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none}
  .sheet.show{display:block}
  .panel{position:absolute;left:0;top:0;bottom:0;width:min(560px,48vw);background:#fff;color:#111;border-top-right-radius:22px;border-bottom-right-radius:22px;overflow:auto;padding:22px;box-sizing:border-box}
  .panel.full{width:min(760px,70vw)}
  .sheet h2{font-size:24px;margin:8px 0 14px}
  .srch{display:flex;align-items:center;gap:10px;border:2px solid #111;border-radius:40px;padding:6px 8px 6px 14px}
  .srch input{flex:1;font-size:26px;border:0;outline:0;padding:8px 4px;background:none}
  .srch button{font-size:20px;border:0;background:#2b7bff;color:#fff;border-radius:30px;padding:12px 20px}
  .back{border:0;background:none;font-size:34px;padding:0 6px;color:#111}
  .item{background:#f1f5fb;border-radius:14px;padding:16px 18px;margin:10px 0;font-size:24px;font-weight:600}
  .item small{display:block;font-size:16px;font-weight:400;color:#666;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
  .grid button{font-size:20px;padding:20px 8px;border-radius:14px;border:0;background:#f1f3f6;color:#111}
  .opt button{font-size:20px;padding:12px 16px;border-radius:12px;border:0;background:#eceff3;color:#111;margin:6px 8px 0 0}
  .opt button.sel{background:#2b7bff;color:#fff;font-weight:800}
  .muted{color:#777;font-size:17px}
  .wide{display:block;width:100%;font-size:24px;padding:18px;border:0;border-radius:14px;background:#2b7bff;color:#fff;margin-top:18px;font-weight:700}
  .keyRow{display:flex;gap:10px}.keyRow input{flex:1;font-size:22px;padding:12px;border:2px solid #ccc;border-radius:10px}.keyRow button{font-size:20px;border:0;border-radius:10px;background:#2b7bff;color:#fff;padding:0 18px}
  #start{position:fixed;inset:0;background:#101215f2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#fff}
  #start button{font-size:40px;padding:26px 60px;border-radius:20px;border:0;background:#3d8bff;color:#fff;font-weight:800}
  #start p{font-size:22px;opacity:.75;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div id="start"><button id="go">시작</button><p id="loadMsg">카메라 데이터 받는 중…</p></div>
<div id="map"></div>
<div id="carMk"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="#fff"/><circle cx="40" cy="40" r="36" fill="none" stroke="#1d6ff2" stroke-width="5"/><path d="M40 16 L56 56 L40 47 L24 56 Z" fill="#1d6ff2" stroke="#1d6ff2" stroke-width="3" stroke-linejoin="round"/></svg></div>
<div id="warn"></div>

<div id="left">
  <div id="turn"><svg id="tArrow" viewBox="0 0 100 100"></svg><div><div id="tDist">-</div><div id="tName"></div></div></div>
  <div id="next"><svg id="nArrow" viewBox="0 0 100 100"></svg><span id="nDist"></span></div>
</div>
<div id="alertBox">
  <div id="spd">-</div>
  <div id="signWrap"><div class="lim" id="lim">60</div>
    <svg id="sgChild" viewBox="0 0 100 92"><polygon points="50,6 95,86 5,86" fill="#fff" stroke="#e02020" stroke-width="10" stroke-linejoin="round"/><circle cx="40" cy="44" r="6" fill="#111"/><circle cx="61" cy="50" r="5" fill="#111"/><path d="M40 51 L36 68 M40 51 L46 66 M40 54 L31 60 M40 54 L50 58 M61 56 L58 70 M61 56 L65 70 M61 59 L53 61 M61 59 L69 63" stroke="#111" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
    <svg id="sgSig" viewBox="0 0 60 100"><rect x="10" y="4" width="40" height="92" rx="10" fill="#222" stroke="#fff" stroke-width="4"/><circle cx="30" cy="25" r="10" fill="#ff3030"/><circle cx="30" cy="50" r="10" fill="#ffc400"/><circle cx="30" cy="75" r="10" fill="#22c55e"/></svg>
  </div>
  <div id="pill">-</div>
  <div id="tag"></div>
</div>

<div id="rightBtns">
  <button class="rb" id="navBtn" title="목적지"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#111" stroke-width="2.6"/><path d="M15 15 L21 21" stroke="#111" stroke-width="2.8" stroke-linecap="round"/></svg></button>
  <div id="zoomGrp"><button class="rb" id="zIn">+</button><button class="rb" id="zOut">−</button></div>
  <button class="rb" id="mute" title="소리"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>
</div>
<div id="prog"><div id="progFill"></div><div id="progDot"></div></div>
<div id="diag"></div>

<div id="bottom">
  <button class="ic" id="reroute" title="경로 다시 찾기"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="bMid"><div id="bInfo"></div><div id="tbar"><div id="tbarIn"></div><div id="tbarDone"></div><div id="tbarDot"></div></div></div>
  <button class="ic" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg></button>
</div>

<div id="fav"><div class="grip"></div><div class="hd"><b>어디로 갈까요?</b><button id="favSearch">검색</button><button id="favClose">닫기</button></div><div id="favList"></div></div>

<div class="sheet" id="navSheet"><div class="panel">
  <div class="srch"><button class="back" id="navClose">‹</button><input id="q" placeholder="장소 검색" autocomplete="off"><button id="qGo">검색</button></div>
  <div id="results"></div>
  <h2 style="margin-top:22px">최근 목적지</h2><div id="recent" class="muted">없음</div>
</div></div>

<div class="sheet" id="rtSheet"><div class="panel">
  <div style="display:flex;align-items:center"><button class="back" id="rtClose">‹</button><h2 style="flex:1;margin:0 0 0 6px" id="rtDest"></h2></div>
  <div id="rtList"></div>
</div></div>

<div class="sheet" id="tripSheet"><div class="panel full">
  <div style="display:flex;align-items:center"><h2 style="flex:1">주행 기록</h2><button class="back" id="tripClose">✕</button></div>
  <div id="tripSum" class="item"></div><div id="tripList"></div>
</div></div>

<div class="sheet" id="menuSheet"><div class="panel">
  <h2>안내음성 크기</h2><input type="range" min="0" max="1" step="0.05" id="volG" style="width:100%">
  <h2>경고음 크기</h2><input type="range" min="0" max="1" step="0.05" id="volW" style="width:100%">
  <h2 style="margin-top:22px">메뉴</h2>
  <div class="grid"><button id="mTrips">주행 기록</button><button id="mDemo">시연</button><button id="mFix">카메라 여기</button><button id="mMap">지도 끄기</button><button id="mSet">설정</button><button id="mClose">닫기</button></div>
  <button class="wide" id="stopNav" style="display:none">안내 종료</button>
</div></div>

<div class="sheet" id="setSheet"><div class="panel full">
  <div style="display:flex;align-items:center"><h2 style="flex:1">설정</h2><button class="back" id="setClose">✕</button></div>
  <h2 style="font-size:20px">과속단속카메라 안내 설정</h2><p class="muted" style="margin:0">제한속도별 안내 시작 기준</p><div id="alertOpts"></div>
  <h2 style="font-size:20px;margin-top:22px">화면 자동 회전</h2><div class="opt" id="rotOpts"></div>
  <h2 style="font-size:20px;margin-top:22px">요금 계산</h2>
  <div class="keyRow" style="align-items:center"><span style="font-size:20px;width:200px">전비 (km/kWh)</span><input id="effIn" type="number" step="0.1" min="2" max="12"></div>
  <div class="keyRow" style="align-items:center;margin-top:10px"><span style="font-size:20px;width:200px">충전 단가 (원/kWh)</span><input id="kwhIn" type="number" step="10" min="0" max="1000"></div>
  <p class="muted">전기요금 = 거리 ÷ 전비 × 충전 단가</p>
  <h2 style="font-size:20px;margin-top:22px">티맵 키 (길 안내용, 이 차에만 저장)</h2><div class="keyRow"><input id="keyIn" placeholder="앱 키 붙여 넣기" autocomplete="off"><button id="keySave">저장</button></div><p class="muted" id="keyState"></p>
  <h2 style="font-size:20px;margin-top:22px">진단 정보 표시</h2><div class="opt"><button id="diagBtn">켜짐</button></div>
</div></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var LS=window.localStorage;
var D2R=Math.PI/180;
function dist(a,b,c,d){var x=(d-b)*D2R*Math.cos((a+c)/2*D2R),y=(c-a)*D2R;return Math.sqrt(x*x+y*y)*6371000}
function brg(a,b,c,d){var y=Math.sin((d-b)*D2R)*Math.cos(c*D2R),x=Math.cos(a*D2R)*Math.sin(c*D2R)-Math.sin(a*D2R)*Math.cos(c*D2R)*Math.cos((d-b)*D2R);return (Math.atan2(y,x)/D2R+360)%360}
function adiff(a,b){return ((b-a)%360+540)%360-180}
function move(la,lo,h,m){var dy=m*Math.cos(h*D2R)/111320,dx=m*Math.sin(h*D2R)/(111320*Math.cos(la*D2R));return[la+dy,lo+dx]}
function fmtD(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+'km':Math.round(m/10)*10+'m'}
function bigD(m){var t=fmtD(m);return t.replace(/(km|m)$/,'<small>$1</small>')}
function show(id,on){$(id).classList.toggle('show',!!on)}

/* 화살표 그림 */
var AR={
  straight:'<path d="M50 95 V34" stroke="#fff" stroke-width="16" fill="none"/><polygon points="24,42 50,6 76,42" fill="#fff"/>',
  right:'<path d="M28 96 V46 H64" stroke="#fff" stroke-width="16" fill="none" stroke-linejoin="round"/><polygon points="60,20 96,46 60,72" fill="#fff"/>',
  left:'<path d="M72 96 V46 H36" stroke="#fff" stroke-width="16" fill="none" stroke-linejoin="round"/><polygon points="40,20 4,46 40,72" fill="#fff"/>',
  sright:'<path d="M34 96 V62 L62 36" stroke="#fff" stroke-width="16" fill="none" stroke-linejoin="round"/><polygon points="48,22 90,10 78,52" fill="#fff"/>',
  sleft:'<path d="M66 96 V62 L38 36" stroke="#fff" stroke-width="16" fill="none" stroke-linejoin="round"/><polygon points="52,22 10,10 22,52" fill="#fff"/>',
  uturn:'<path d="M70 96 V46 A20 20 0 0 0 30 46 V64" stroke="#fff" stroke-width="16" fill="none"/><polygon points="10,58 30,94 50,58" fill="#fff"/>',
  dest:'<path d="M50 6 C30 6 18 21 18 38 C18 62 50 94 50 94 C50 94 82 62 82 38 C82 21 70 6 50 6 Z" fill="#fff"/><circle cx="50" cy="38" r="13" fill="#17643f"/>'

  var avg=null;
  if(section){section.m+=dist(section.lastLa,section.lastLo,la,lo);section.lastLa=la;section.lastLo=lo;avg=section.m/Math.max(1,(now-section.t)/1000)*3.6;if(avg>section.lim)over=true;if(section.m>30000)section=null}
  if(target&&target.d<alertD+30){var c=target.c,d=dist(la,lo,c[0],c[1]);target.d=Math.min(target.d,d);
    setAlert('on'+(c[3]==='R'?' sig':'')+(c[3]==='X'?' sx':'')+(c[5]===2?' child':'')+(c[4]>0?' sec':''),c[2]||'',fmtD(d),camTag(c));
    zone=c[5]>0&&d<alertD;
    if(d<alertD&&!announced[target.id]){announced[target.id]=1;var r=Math.round(d/50)*50;
      say((c[5]===2?'어린이보호구역, ':'')+'전방 '+r+'미터, '+(c[2]?'제한속도 '+c[2]+', ':'')+(c[4]===1?'구간단속 시작입니다':'단속 카메라입니다'),880,2)}
    if(c[2]&&d<alertD&&kmh>c[2])over=true;
  }else if(section){setAlert('on sec',section.lim,'평균 '+Math.round(avg||0),'구간단속 중')}
  else setAlert('','','');
  tripTick(la,lo,kmh,now,over);
  document.body.classList.toggle('over',over);document.body.classList.toggle('zone',zone);
  if(over&&now-lastBeep>700){beep(1400,0.15,1);lastBeep=now}
  if(CFG.diag){var g=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b},0)/gaps.length):0;
    $('diag').textContent=(demo?'시연 중 · ':'')+'정확도 '+Math.round(lastAcc)+'m · 간격 '+g+'ms · 수신 '+fixes+'\n속도 '+spdSrc+' · 알림 '+fmtD(alertD)+' · 음성 '+(KO?'한국어':'없음')+' · 카메라 기준 '+(LS.getItem('camsRef')||'-')}
  requestAnimationFrame(tick);
}

loadCams();
