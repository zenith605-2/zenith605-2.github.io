  <ol>
    <li>How did you recruit the users who took part in your closed test? For

    <li><b>Summarise the feedback you received from testers. Also tell us how you

  </ol>

  <ol start="5">
    <li>Who is the main audience for your app?</li>
    <li>Describe the value your app provides to users.</li>
    <li>How many installs do you expect in the first year?

    <li>How did you decide the app is ready for production?</li>

  <p>Two weeks later, "what feedback did I get" usually returns nothing. So you
  write something plausible — "testers found the UI intuitive and offered a few
  suggestions". The person reading it sees a few hundred of those a day.</p>

  where to start. I added a three-screen intro on first launch, and he has kept
  using it since that build."
  </blockquote>

  <p>One person, one change, what happened after. That shape cannot be invented.</p>

  <h2>So where do the answers come from</h2>

  <p>From what you wrote down. You do not compose them at the end; you retrieve
  what the 14 days left behind.</p>

  <p>Three things are worth keeping.</p>
