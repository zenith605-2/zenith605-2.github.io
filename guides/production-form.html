  <h1 style="font-size:28px;margin:0 0 8px">The 9 questions in the production form</h1>
  <p class="muted" style="margin:0 0 24px">Two of them decide it</p>

  <p>Once 12 testers have been opted in for 14 days you can apply for production.
  Tapping apply does not send you straight to review — <b>a form appears first.</b>
  Ten questions, mostly free text, roughly 300 characters per answer.</p>

  <p>This is where people stall. Finishing 14 days and describing what happened
  during those 14 days are two different jobs.</p>

    <h2>What it asks</h2>

  <p>The button opens a three-step form. Nine questions, and every free-text
  box is capped at <b>exactly 300 characters</b>. Two of them are multiple
  choice.</p>

  <p><b>Step 1 &middot; Closed testing</b></p>

  <ul>
    <li>How did you recruit testers — it gives friends/family and paid services as examples</li>
    <li>How easy was recruiting <i>(very hard ~ very easy)</i></li>
    <li>Tester engagement — did they use every feature, and does their usage match real users</li>
    <li><b>Summarise the feedback you got, and how you collected it</b> — both in one box</li>
  </ul>

  <p><b>Step 2 &middot; App info</b></p>

  <ul>
    <li>Who is this app mainly for</li>
    <li>What value does it give users</li>
    <li>Expected installs in year one <i>(0-10K / 10K-100K / 100K-1M / 1M+ / don't know)</i></li>
  </ul>

  <p><b>Step 3 &middot; Production readiness</b></p>

  <ul>
    <li><b>What did you change based on what the test taught you</b></li>
    <li>How did you decide it was ready</li>
  </ul>

  <p>The two in bold are where it is actually decided. The rest you can write
  without stopping if you built the app.</p>

  <p>The engagement question is the awkward one if you found your testers by
  trading. It asks whether their usage matches what real users would do, and to
  explain the difference if not. Honesty reads better here — saying developers
  tested each other and how that differs from real use holds together better
  than an invented sentence.</p>

  <p class="muted">Your answers are not shown on the Play listing. The form says
  so on screen, so there is no reason to write them like marketing copy.</p>

<h2>Why those two are hard</h2>

  <p>Two weeks later, "what feedback did I get" usually returns nothing. So you
  write something plausible — "testers found the UI intuitive and offered a few
  suggestions". The person reading it sees a few hundred of those a day.</p>

  <p>Compare:</p>

  <blockquote style="margin:14px 0;padding:10px 14px;border-left:3px solid var(--mint)">
  "One tester said the features came at him all at once and he did not know
  where to start. I added a three-screen intro on first launch, and he has kept
  using it since that build."
  </blockquote>

  <p>One person, one change, what happened after. That shape cannot be invented.</p>

  <h2>So where do the answers come from</h2>

  <p>From what you wrote down. You do not compose them at the end; you retrieve
  what the 14 days left behind.</p>

  <p>Three things are worth keeping.</p>

  <ul>
    <li><b>Who tested, and for how many days</b> — per person, not "12 for 14 days"</li>
    <li><b>The feedback verbatim</b> — do not summarise it</li>
    <li><b>What you replied</b> — that reply <em>is</em> your answer to "what did you change"</li>
  </ul>

  <p>The third one matters most. Reply to feedback when it arrives and there is
  nothing to reconstruct later.</p>

  <h2>Nobody opens it all 14 days, by the way</h2>

  <p>Across <a href="/guides/daily-opens-data.html">44 finished trades we
  measured</a>, testers opened the app on 8.5 of 14 days on average. Two of 44
  hit all 14. One never opened it at all.</p>

  <p>So you do not need to claim your testers used it every day. Google counts
  how long they stayed opted in, not how often they opened it — see
  <a href="/guides/what-google-checks.html">what Google actually checks</a>.</p>

  <h2>If you get rejected, do you start over</h2>

  <p>No. A rejection means you apply again; it does not un-enrol your testers.
  They are still opted in and the days keep counting. Fill in what was thin and
  submit again.</p>

  </div>

  <p class="muted" style="font-size:13px">
    Google changes this form regularly. The list above is as of September 2026
    and the exact wording varies by account.
  </p>`,
