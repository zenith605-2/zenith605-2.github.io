import { mountAuth } from '/assets/api.js?v=121';
import { t, applyDom, langPicker, wireLangPicker, LANG } from '/assets/i18n.js?v=121';
import { sectionAnchors } from '/assets/anchors.js?v=121';

const SHOT = (src, cap) =>
  '<figure><img src="' + src + '" alt="" loading="lazy">' +
  '<figcaption>' + cap + '</figcaption></figure>';

const P = '/img/guide/closed-test/';

// 이 가이드는 영문만 둔다 (사용자 결정, 2026-09-16). DOC 을 쓰는 건 다른
// 가이드와 껍데기를 맞추기 위한 것이고, 언어판은 만들지 않는다.
const DOC = {
  en: `
  <h1 style="font-size:28px;margin:0 0 8px">Set up a closed test, from an empty account</h1>
  <p class="muted" style="margin:0 0 24px">Every screen in order, with the parts that trip people up.</p>

  <p>Google requires a closed test before an individual developer account can
  publish: <b>12 testers, opted in, for 14 consecutive days</b>. Most guides
  explain the rule. This one walks the console instead — every screen from an
  account with nothing in it, in the order you actually meet them.</p>

  <p>The screenshots are from a real app set up for this guide in
  September 2026, not mock-ups. Where something failed, the failure is here too.</p>

  <h2><span class="step">1</span>Create the app</h2>
  <p><b>All apps → Create app.</b> Four fields and two checkboxes.</p>
  ${SHOT(P + '01-create-app.png', 'The create form. The package name is permanent — you cannot change it later, and you cannot reuse it if you delete the app.')}
  <ul>
    <li><b>App name</b> — 30 characters, shown on Google Play. Changeable later.</li>
    <li><b>Package name</b> — <b>permanent.</b> Use reverse-domain form
    (<code>com.yourname.yourapp</code>) and make sure it matches what is in your
    <code>build.gradle</code>. Press <b>Check availability</b> before you continue.</li>
    <li><b>Default language</b> — the language your store listing falls back to.</li>
    <li><b>App or game</b>, <b>Free or paid</b> — free cannot become paid after you publish.</li>
  </ul>
  ${SHOT(P + '02-declarations.png', 'Both boxes are required. You are signing for the app, so read them rather than reflex-clicking.')}

  <h2><span class="step">2</span>Find the closed test</h2>
  <p><b>Test and release</b> in the left menu. Three kinds of testing sit here,
  and beginners often pick the wrong one.</p>
  ${SHOT(P + '03-test-and-release.png', 'Open, closed and internal testing, plus internal app sharing. Only closed testing counts toward production access.')}
  <ul>
    <li><b>Internal testing</b> — up to 100 testers, live in seconds, no review.
    Good for checking your build works. <b>Does not count</b> toward the 14 days.</li>
    <li><b>Closed testing</b> — this is the one Google requires.</li>
    <li><b>Open testing</b> — anyone can join. Not needed for production access.</li>
  </ul>

  <h2><span class="step">3</span>The track already exists</h2>
  <p>This surprises people: you do not create a track. <b>Closed testing – Alpha</b>
  is already there. <b>Manage track</b>, not <b>Create track</b>.</p>
  ${SHOT(P + '04-closed-testing-tracks.png', 'Alpha comes with the app. "Create track" is for extra tracks — a second one for a different group, which you do not need yet.')}
  <p>Inside, the track has a four-task checklist. Two set the track up, two ship
  a build. They unlock in order — the last two are padlocked until the first two
  are done.</p>
  ${SHOT(P + '05-track-checklist.png', 'Select countries, select testers, create a release, send for review. Nothing is live until all four are green.')}

  <h2><span class="step">4</span>Countries</h2>
  <p>An empty country list is the single most expensive mistake on this page,
  because it fails <i>silently</i>. Testers who are outside your list see
  <b>"not available in your country"</b> in the Play Store and usually just
  disappear without telling you.</p>
  ${SHOT(P + '06-countries-empty.png', 'The starting state: no countries. Your opt-in link works for nobody.')}
  ${SHOT(P + '07-countries-picker.png', 'Add countries / regions. The checkbox in the header row selects every country at once.')}
  <li class="hot">If you are recruiting testers from the internet, tick them all.
  You do not know where the person who helps you lives, and there is no penalty
  for being available in a country you never market in.</li>
  ${SHOT(P + '08-countries-targeted-177.png', 'Targeted (177), and the first checklist item goes green: 1 of 4 complete.')}
  <p>More on this, including how to tell whether your test track is locked to
  your production country list:
  <a href="/guides/country-availability.html">Open your closed test to all countries</a>.</p>

  <h2><span class="step">5</span>Testers</h2>
  <p>Two ways to say who may join, and the choice matters more than it looks.</p>
  ${SHOT(P + '09-testers-choice.png', 'Email lists or Google Groups. You pick one; they are radio buttons, not a combination.')}
  <ul>
    <li><b>Email lists</b> — you paste addresses into the console. Simple, and
    fine while you know every tester. Every change means editing the list yourself.</li>
    <li><b>Google Groups</b> — you give the console one group address and manage
    members in the group. Better once people come and go, but the group has to be
    open enough for strangers to join, and a private group is the single most
    common reason a tester cannot get in.
    See <a href="/guides/google-group.html">Setting up a Google Group for testers</a>.</li>
  </ul>
  ${SHOT(P + '10-create-email-list.png', 'Create email list. Comma-separated, or a CSV upload for a long list.')}

  <h3>The error Google will not explain</h3>
  <p>Filling this in with placeholder addresses fails, and the console does not
  say why.</p>
  ${SHOT(P + '11-email-list-filled.png', 'Three addresses accepted into the list, Save changes enabled. Looks fine.')}
  ${SHOT(P + '12-email-list-error.png', '“Your changes couldn’t be saved”, a red mark on every row, and no explanation anywhere on the page.')}
  <p>The addresses were <code>@example.com</code>. <b>Tester addresses have to be
  real Google accounts</b> — the console validates them server-side and reports
  only a generic failure. If a save fails here, check the addresses one at a time
  rather than looking for a setting.</p>
  ${SHOT(P + '13-testers-selected.png', 'A valid list ticked and saved. Below it sits the opt-in link testers will use.')}

  <h2><span class="step">6</span>The release</h2>
  <p>With countries and testers done, the last two tasks unlock.
  <b>Create new release</b> opens the upload page.</p>
  ${SHOT(P + '14-create-release-upload.png', 'Drop the .aab here. "Add from library" reuses a bundle you already uploaded to another track.')}
  <ul>
    <li><b>App bundle (.aab)</b>, not an APK. Play Console has not accepted APKs
    for new apps for years.</li>
    <li>It must be signed with your <b>upload key</b>, not the debug key. A debug
    build is rejected on upload. If you have never made a keystore, that is the
    step people miss — a plain <code>flutter build appbundle</code> in a fresh
    project is still debug-signed.</li>
    <li><b>Release name</b> is for you, not for testers. Release notes are shown
    to testers, per language.</li>
  </ul>

  ${SHOT(P + '15-bundle-uploaded.png', 'The bundle accepted: version, API levels, target SDK. If it were signed with the debug key it would have been rejected right here.')}

  <h2><span class="step">7</span>The four errors nobody warns you about</h2>
  <p>Press <b>Next</b> and the console finally tells you the track was never the
  thing standing in your way.</p>
  ${SHOT(P + '17-four-errors.png', 'Four errors, found only after the bundle is uploaded. None of them are about the release.')}
  <p>Every one of these lives somewhere else in the console:</p>
  <ul>
    <li><b>"Your app cannot be published yet. Complete the steps listed on the
    Dashboard."</b> — the app-setup task list: store listing, content rating,
    data safety, target audience, privacy policy.</li>
    <li><b>"Add a full description to save"</b> — your store listing is empty.
    A closed test still needs a listing.</li>
    <li><b>"You must let us know whether your app includes any financial
    features."</b> — a declaration, even if the answer is no.</li>
    <li><b>"You must complete the health declaration"</b> — same.</li>
  </ul>
  <li class="hot">This is the order that wastes a day: people build the track,
  sign the app, upload the bundle, and only then discover a pile of unrelated
  forms. <b>Do the Dashboard task list first</b>, then come back here. The track
  itself takes ten minutes; the forms do not.</li>

  <p>The Dashboard says so, in a line most people scroll past: <b>"To start a
  closed test, finish setting up your app."</b> The whole closed-testing section
  is padlocked until the list above it is done.</p>
  ${SHOT(P + '18-dashboard-locked.png', 'Closed testing, locked. The order is right there — it is just below the fold.')}

  <h2><span class="step">8</span>The eleven forms</h2>
  <p>This is the list that actually gates your test.</p>
  ${SHOT(P + '19-setup-task-list.png', 'Nine content declarations and two store items. Most take a minute; three do not.')}
  <ul>
    <li><b>Privacy policy</b> — needs a URL that is already live. If you have no
    site, a single static page on GitHub Pages is enough, and it has to describe
    what your app actually does with data.</li>
    <li><b>Content rating</b> — an IARC questionnaire. If your app shows anything
    fetched or generated at runtime, answer <b>yes</b> to online content;
    generated AI output is named in Google's own examples.</li>
    <li><b>Data safety</b> — the long one. Every type of data that leaves the
    device has to be declared, including data your libraries send. An ads SDK
    means you are collecting and sharing a device identifier whether you think
    of it that way or not.</li>
    <li><b>Store listing</b> — full description, icon, a feature graphic
    (1024x500) and at least two phone screenshots. A closed test still needs all
    of it.</li>
    <li>The rest — sign-in details, ads, target audience, government apps,
    financial features, health, app category — are a click each if the answer is
    no.</li>
  </ul>
  ${SHOT(P + '22-setup-done-testing-unlocked.png', 'When the last one is done the whole setup section disappears and closed testing unlocks.')}
  ${SHOT(P + '23-no-errors-ready.png', 'The same review page as before, with the four errors gone.')}

  <h2><span class="step">9</span>Review, then the wait</h2>
  <p>Send the release for review. First review of a new app is usually a few days,
  not hours. Nothing about your test starts until it is approved — including the
  14 days.</p>
  <p>After approval, your testers join with the opt-in link from step 5
  (<code>play.google.com/apps/testing/&lt;your.package&gt;</code>). Then:</p>
  <ul>
    <li>Each tester has to <b>open the opt-in link and accept</b>, then install
    from Play. Installing an APK you send them does not count.</li>
    <li>You need <b>12 of them, at the same time, for 14 consecutive days.</b>
    Someone who opts out on day 9 resets that person, not the clock.</li>
    <li>Google also looks for <b>real use</b> and <b>updates shipped during the
    test</b>. Twelve accounts that opted in and never opened the app is the most
    common rejection. See
    <a href="/guides/what-google-checks.html">What Google actually checks</a>.</li>
  </ul>
  <p>When a tester cannot get in, they almost never say why.
  <a href="/guides/blocked-screens.html">The six screens that stop a tester</a>
  is the list to send them.</p>

  <div class="note" style="margin:26px 0">
    <b>ACT Party</b> is where developers test each other's apps to fill those 12.
    Daily opens are recorded automatically from Android usage, so you can see who
    is actually opening your app instead of guessing.
    <a href="/">Free at actparty.app</a>
  </div>

  <p class="muted" style="font-size:13px">Screens are from Play Console in
  September 2026. Google moves things and rewords buttons often, so a label may
  sit somewhere slightly different by the time you read this.</p>`,
};

document.getElementById('langSlot').innerHTML = langPicker();
document.getElementById('doc').innerHTML = DOC.en;
sectionAnchors('en');
applyDom();
wireLangPicker();
mountAuth('authSlot', t);
</script>
