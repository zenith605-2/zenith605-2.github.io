const DOC = {
  en: `
  <h1 style="font-size:28px;margin:0 0 8px">Register an app and run your first closed test</h1>
  <p class="muted" style="margin:0 0 22px">Every screen, in the order you should actually do them.</p>

  <p>Google requires a closed test before an individual developer account can
  publish: <b>12 testers, opted in, for 14 consecutive days</b>. Most guides
  explain the rule. This one walks the console — from an account with nothing
  in it to a release sitting in review.</p>

  <p>Every screenshot is from one app registered for this guide in September
  2026. Where something failed, the failure is in here too, at the step where
  it happens.</p>

  <div class="toc">
    <b>The order that works</b>
    <ol>
      <li>Get four things ready before you open the console</li>
      <li>Register the app — creation, eleven declarations, store listing</li>
      <li>Set up the closed test track — countries, testers, the build</li>
      <li>Submit for review</li>
      <li>Fix the three things that break once testing starts</li>
    </ol>
    <p style="margin:10px 0 0;font-size:13.5px;color:#5b6672">Doing 3 before 2
    is the mistake that costs a day. There is a section at the end showing
    exactly what that looks like.</p>
  </div>

  <div class="note" style="margin:0 0 22px">
    <b>Console in the wrong language?</b> Play Console follows your Google
    account language and has no language setting of its own. Add
    <code>?hl=en</code> to any console URL and that page loads in English.
    It does not survive navigation, so add it again when you need it.
  </div>

  <div class="part">Part 1 &mdash; Before you open the console</div>

  <h2><span class="step">1</span>Four things you need first</h2>
  <p>Each of these blocks registration further down. Getting them now saves you
  from stopping halfway.</p>

  <h3>A developer account</h3>
  <p>A one-off 25 USD registration, and for a personal account Google now
  requires identity verification. Do this first — verification can take days,
  and nothing else can start without it.</p>

  <h3>An upload key, and a build signed with it</h3>
  <p>Play rejects a debug-signed bundle. If you have never made a keystore this
  is the step people miss: a plain <code>flutter build appbundle</code> in a
  fresh project is still debug-signed.</p>
  <pre class="box">keytool -genkeypair -v \\
  -keystore upload.jks -storetype JKS \\
  -keyalg RSA -keysize 2048 -validity 10000 \\
  -alias upload</pre>
  <p>Put the keystore outside version control, wire it into your release build,
  then confirm it took:</p>
  <pre class="box">keytool -printcert -jarfile app-release.aab | head -1
# Owner: CN=...   &lt;- your name, not "Android Debug"</pre>
  <li class="hot"><b>Keep the keystore and its password.</b> With Play App
  Signing — the default now — a lost <i>upload</i> key can be reset by Google,
  so it is not fatal. Losing the account is.</li>

  <h3>A privacy policy at a public URL</h3>
  <p>Required, and the field will not accept a promise to write one later. A
  single static page is enough and GitHub Pages hosts one free. It has to
  describe what your app actually does with data — if your app sends anything
  to a third-party service, say so, by name.</p>

  <h3>Store graphics</h3>
  <p>Have these ready as files before you start the listing:</p>
  <ul>
    <li><b>App icon</b> — 512 x 512 PNG, under 1 MB</li>
    <li><b>Feature graphic</b> — 1024 x 500 PNG or JPEG</li>
    <li><b>Phone screenshots</b> — at least 2, each side between 320 px and
    3840 px, and no side more than twice the other. Take them from a real
    device. If your build shows test ads, crop that banner out — "This is a
    test ad" in a store screenshot reads as unfinished.</li>
  </ul>

  <div class="part">Part 2 &mdash; Register the app</div>

  <h2><span class="step">2</span>Create the app</h2>
  <p><b>All apps → Create app.</b> Four fields and two checkboxes.</p>
  ${SHOT(P + 'a1-create-app.png', 'The create form. The package name is permanent — you cannot change it, and you cannot reuse it if you delete the app.')}
  <ul>
    <li><b>App name</b> — 30 characters, shown on Google Play. Changeable later.</li>
    <li><b>Package name</b> — <b>permanent.</b> Reverse-domain form
    (<code>com.yourname.yourapp</code>), and it must match your
    <code>build.gradle</code>. Press <b>Check availability</b> before continuing.</li>
    <li><b>Default language</b> — what your listing falls back to.</li>
    <li><b>App or game</b>, <b>Free or paid</b> — free cannot become paid after
    you publish.</li>
  </ul>
  ${SHOT(P + 'a2-declarations.png', 'Both boxes are required. You are signing for the app, so read them.')}

  <h2><span class="step">3</span>The eleven declarations</h2>
  <p>This is the part that actually gates everything, and the part most guides
  skip. <b>Dashboard → Finish setting up your app → View tasks.</b></p>
  ${SHOT(P + 'a3-task-list.png', 'Nine content declarations and two store items. Do these before you touch the test track.')}
  <p>Seven are one click if the answer is no — <b>sign-in details</b>,
  <b>government apps</b>, <b>financial features</b>, <b>health</b>, plus
  <b>app category</b> and contact details. Four deserve attention.</p>

  <h3>Privacy policy</h3>
  <p>Paste the URL from Part 1. It is checked for reachability, so the page has
  to be live already.</p>
  ${SHOT(P + 'a4-privacy-policy.png', 'One field, but the page behind it has to exist.')}

  <h3>Ads</h3>
  <p>If you bundled an ads SDK the answer is yes, even if ads are not switched
  on yet. Saying no and shipping ads is a policy violation.</p>
  ${SHOT(P + 'a5-ads.png', 'Answering yes puts a "Contains ads" label on your listing.')}

  <h3>Content rating</h3>
  <p>An IARC questionnaire. The trap is <b>Online Content</b>: "content that
  isn't part of the initial app download, but can be accessed from the app."
  Google's own examples include <b>generated AI content</b>. If your app calls a
  model at runtime that is a yes, and answering it opens the violence,
  sexuality, language and drugs questions.</p>
  ${SHOT(P + 'a6-content-rating.png', 'Ratings come back per territory — ESRB, PEGI, ClassInd and the rest.')}

  <h3>Data safety</h3>
  <p>The long one. Every data type that <i>leaves the device</i> has to be
  declared — including data your libraries send, which is what people get
  wrong. Two easy misses:</p>
  <ul>
    <li>An ads SDK collects and <b>shares</b> a <b>device or other ID</b>. That
    is a declaration whether or not you think of it as your data collection.</li>
    <li>If your app sends user text to an AI API, that is <b>Messages →
    Other in-app messages</b>, collected <i>and</i> shared. Free API tiers often
    permit the provider to use that content to improve their models, which means
    you cannot call it "processed ephemerally".</li>
  </ul>
  ${SHOT(P + 'a7-data-safety.png', 'The preview is exactly what users see on your listing. A wrong declaration is grounds for removal.')}

  <h3>Store listing</h3>
  <p>App name, short description (80 chars), full description (4000), and the
  graphics from Part 1. A closed test still needs a complete listing.</p>
  ${SHOT(P + 'a8-listing-text.png', 'Short description is the line users see before expanding.')}
  ${SHOT(P + 'a9-listing-graphics.png', 'Icon, feature graphic, and at least two phone screenshots. All required.')}

  <p>When the last one is done the whole setup section disappears from the
  Dashboard and closed testing unlocks.</p>
  ${SHOT(P + 'a10-setup-done.png', 'Setup gone, closed testing open. Now the track.')}

  <div class="part">Part 3 &mdash; Set up the closed test</div>

  <h2><span class="step">4</span>Find it</h2>
  <p><b>Test and release</b> in the left menu. Three kinds of testing live here
  and beginners often pick the wrong one.</p>
  ${SHOT(P + 'c1-test-and-release.png', 'Only closed testing counts toward production access.')}
  <ul>
    <li><b>Internal testing</b> — up to 100 testers, live in seconds, no review.
    Good for checking a build. <b>Does not count</b> toward the 14 days.</li>
    <li><b>Closed testing</b> — the one Google requires.</li>
    <li><b>Open testing</b> — anyone can join. Not needed for production access.</li>
  </ul>

  <h2><span class="step">5</span>The track already exists</h2>
  <p>You do not create a track. <b>Closed testing – Alpha</b> is already there.
  <b>Manage track</b>, not <b>Create track</b>.</p>
  ${SHOT(P + 'c2-tracks.png', 'Alpha comes with the app. "Create track" is for a second group you do not need yet.')}
  ${SHOT(P + 'c3-checklist.png', 'Four tasks. The last two stay padlocked until the first two are done.')}

  <h2><span class="step">6</span>Countries</h2>
  <p>An empty country list is the most expensive mistake on this page because it
  fails <i>silently</i>. Testers outside your list see <b>"not available in your
  country"</b> in the Play Store and usually vanish without telling you.</p>
  ${SHOT(P + 'c4-countries-empty.png', 'The starting state: no countries. Your opt-in link works for nobody.')}
  ${SHOT(P + 'c5-countries-picker.png', 'The checkbox in the header row selects every country at once.')}
  <li class="hot">If you are recruiting testers from the internet, tick them
  all. You do not know where the person who helps you lives, and there is no
  penalty for being available somewhere you never market.</li>
  ${SHOT(P + 'c6-countries-done.png', 'Targeted (177), and the first checklist item goes green.')}
  <p>More, including how to tell whether your test track is locked to your
  production country list:
  <a href="/guides/country-availability.html">Open your closed test to all countries</a>.</p>

  <h2><span class="step">7</span>Testers</h2>
  <p>Two ways to say who may join. They are radio buttons — you pick one.</p>
  ${SHOT(P + 'c7-testers-choice.png', 'Email lists or Google Groups.')}
  <ul>
    <li><b>Email lists</b> — you paste addresses into the console. Fine while
    you know every tester; every change means editing the list yourself.</li>
    <li><b>Google Groups</b> — you give the console one group address and manage
    members in the group. Better once people come and go, but the group has to
    be open enough for strangers to join. A private group is the single most
    common reason a tester cannot get in — see
    <a href="/guides/google-group.html">Setting up a Google Group for testers</a>.</li>
  </ul>
  ${SHOT(P + 'c8-email-list.png', 'Create email list. Comma-separated, or a CSV for a long list.')}

  <h3>The error Google will not explain</h3>
  ${SHOT(P + 'c9-email-list-filled.png', 'Three addresses accepted into the list, Save enabled. Looks fine.')}
  ${SHOT(P + 'c10-email-list-error.png', 'Save fails with one generic line and a red mark on every row. No explanation anywhere on the page.')}
  <p>The addresses were <code>@example.com</code>. <b>Tester addresses have to be
  real Google accounts</b> — the console validates them server-side and reports
  only a generic failure. If a save fails here, check the addresses one at a
  time rather than hunting for a setting.</p>
  ${SHOT(P + 'c11-testers-done.png', 'A valid list ticked and saved. Below it sits the opt-in link testers will use.')}

  <h2><span class="step">8</span>Upload the build</h2>
  <p>With countries and testers done the last two tasks unlock.
  <b>Create new release</b>.</p>
  ${SHOT(P + 'c12-upload.png', 'Drop the .aab here. "Add from library" reuses a bundle from another track.')}
  <ul>
    <li><b>App bundle (.aab)</b>, not an APK. Play has not accepted APKs for new
    apps for years.</li>
    <li>Signed with your <b>upload key</b> from Part 1. A debug build is rejected
    on upload.</li>
    <li><b>Release name</b> is for you. Release notes are shown to testers, per
    language.</li>
  </ul>
  ${SHOT(P + 'c13-bundle-ok.png', 'Accepted: version, API levels, target SDK. A debug-signed bundle would have been refused here.')}
  ${SHOT(P + 'c14-review-clean.png', 'Preview and confirm, with no errors — because Part 2 was done first.')}

  <div class="part">Part 4 &mdash; Submit</div>

  <h2><span class="step">9</span>One more that is not on any list</h2>
  <p>Press send and Google runs quick checks first. Ours came back with a
  twelfth requirement that appears nowhere on the Dashboard.</p>
  ${SHOT(P + 'd1-ad-id-issue.png', 'Found only at submit time: "Incomplete advertising ID declaration".')}
  <p>Anyone shipping an ads SDK meets this. If your manifest contains
  <code>com.google.android.gms.permission.AD_ID</code> — and the Google Mobile
  Ads SDK merges it in whether or not you wrote it — you have to declare that
  the app uses an advertising ID. The console is unusually direct:
  <i>"Your manifest file includes the AD_ID permission. Answer 'yes' or remove
  this permission from your manifest."</i></p>
  <p>Answer it and the checks restart from the beginning. Budget another fifteen
  minutes.</p>

  <h2><span class="step">10</span>Send it</h2>
  ${SHOT(P + 'd2-ready.png', '"Your changes can now be sent for review." The button finally works.')}
  ${SHOT(P + 'd3-in-review.png', 'Changes in review. For a new app this is usually a few days, not hours.')}
  <p>Nothing about your test starts until the review passes — including the
  14 days.</p>

  <h2><span class="step">11</span>Then the wait</h2>
  <p>After approval, testers join with the opt-in link from step 7
  (<code>play.google.com/apps/testing/&lt;your.package&gt;</code>).</p>
  <ul>
    <li>Each tester has to <b>open the opt-in link and accept</b>, then install
    from Play. Sending them an APK does not count.</li>
    <li>You need <b>12 of them, at the same time, for 14 consecutive days.</b>
    Someone who opts out on day 9 resets that person, not the clock.</li>
    <li>Google also looks for <b>real use</b> and <b>updates shipped during the
    test</b>. Twelve accounts that opted in and never opened the app is the most
    common rejection. See
    <a href="/guides/what-google-checks.html">What Google actually checks</a>.</li>
  </ul>
  <p>When a tester cannot get in they almost never say why.
  <a href="/guides/blocked-screens.html">The six screens that stop a tester</a>
  is the list to send them.</p>

  <div class="part">Part 5 &mdash; After review passes</div>

  <p>The release is approved and the track is live. This is where most tests
  stall, and all three causes look identical to a tester: a page that will not
  open. None of them produce a useful error message.</p>

  <h2><span class="step">12</span>Your group is private, because that is the default</h2>

  <p>Google Groups never asks you to make the group private. It arrives that
  way. On the creation screen the two settings that matter are already set to
  the closed values, and nothing on the page suggests you should change them.</p>

  ${SHOT(P + 'g1-privacy-defaults.png', 'The privacy step while creating a group. Who can search for group: Group members. Who can join group: Only invited users. Nobody chose these, they are what Google fills in.')}

  <p>A tester who opens that group link sees this, and it tells them nothing:</p>

  ${SHOT(P + 't1-content-unavailable.png', 'What a tester sees when the group is private. Content unavailable, and a suggestion to switch accounts, which is not the problem.')}

  <p>Note what it does <b>not</b> say: that the group exists, that they are not
  a member, or that they should ask you for access. Testers read "try switching
  accounts", switch accounts, get the same page, and give up on you.</p>

  <h3>The fix</h3>
  <p>Open the group, then <b>Group settings &rarr; General</b>. Two dropdowns,
  both well down the page.</p>

  ${SHOT(P + 'g3-settings-before.png', 'Before. Who can see group: Group members. Who can join group: Invited users only.')}
  ${SHOT(P + 'g4-see-group-dropdown.png', 'Who can see group has exactly two values. Pick Anyone on the web.')}
  ${SHOT(P + 'g5-join-group-dropdown.png', 'Who can join group has three. Anyone on the web can ask puts every tester into an approval queue you have to clear by hand. For a test group pick Anyone on the web can join.')}
  ${SHOT(P + 'g6-settings-after.png', 'After, before saving. Anyone on the web, and Anyone on the web can join.')}
  ${SHOT(P + 'g7-settings-saved.png', 'Saved. Read the line: it might take some time for the changes to take effect. If the link still fails a minute later, wait before you change anything else.')}

  <p>Now the tester gets a Join group button. The body of the page still says
  they have no permission, because <i>Who can view conversations</i> is a
  separate setting and is still members only. That is harmless, and worth
  warning testers about, because it reads like a failure:</p>

  ${SHOT(P + 't2-join-but-no-permission.png', 'After the fix. The permission message is about the message archive, not about joining. The Join group button is the part that matters.')}
  ${SHOT(P + 't3-join-dialog.png', 'Joining. Subscription defaults to Each email. Tell testers to set it to No email unless you want them to get every post.')}
  ${SHOT(P + 't4-joined.png', 'Joined, member count up immediately. With Anyone on the web can join there is nothing for you to approve.')}

  <h2><span class="step">13</span>They joined the group and the opt-in page still will not open</h2>

  <p>This is the one that costs days, because the tester did everything right
  and the page still says no.</p>

  ${SHOT(P + 't5-optin-app-not-available.png', 'App not available. This tester is signed in with the correct account and is a member of the group.')}

  <p>Work through these in order. The first two account for almost all of it.</p>

  <h3>1. The track is using an email list, not the group</h3>
  <p>These are two settings on the same page and only one can be active. If you
  made an email list early on and added the group later, the radio button is
  still on the list, and group membership does nothing at all.</p>

  ${SHOT(P + 'p2-testers-emaillist.png', 'The cause. Testers is set to Email lists, so the Google Group is ignored entirely.')}
  ${SHOT(P + 'p4-testers-google-group.png', 'Switch the radio to Google Groups and type the full address, ending in @googlegroups.com.')}
  ${SHOT(P + 'p5-testers-save-enabled.png', 'The address has to turn into a chip before Save lights up. If Save stays grey, press Tab.')}

  <h3>2. The list is there, but it is not ticked</h3>
  <p>An email list only applies while its row is checked. The list can exist,
  hold the right people, show the right count, and still do nothing. Save stays
  available with nothing ticked, so it is easy to leave it this way.</p>

  ${SHOT(P + 'e1-list-unchecked.png', 'A list with two testers in it, doing nothing. The count is right and the row is unchecked.')}

  <h3>3. A typo in one address</h3>
  <p>Play does not check that an address exists. Anything shaped like an email
  is accepted, so one wrong character silently costs you a tester, and the only
  symptom is that person seeing App not available.</p>

  ${SHOT(P + 'e2-email-typo.png', 'Accepted without complaint. Nothing on this screen will ever tell you that address does not exist.')}

  <p>Read the list back against what the tester actually sent you, character by
  character. This is also the strongest argument for using a Google Group
  instead: the tester types their own address, so you cannot get it wrong.</p>

  <h3>4. You saved it, but you did not send it</h3>
  <p>Saving a tester change does not apply it. It parks the change in Publishing
  overview, where it sits until you submit it. This is the most common reason a
  correct fix appears to do nothing.</p>

  ${SHOT(P + 'p6-go-to-publishing-overview.png', 'The dialog says it plainly. Your change has been saved. To send it to Google for review, go to Publishing overview.')}
  ${SHOT(P + 'p7-publishing-overview-pending.png', 'Changes not yet submitted for review. Nothing on this list is live yet.')}
  ${SHOT(P + 'p8-send-for-review-dialog.png', 'Reviews are typically completed within 7 days. A tester list change is usually much quicker, but it is never instant.')}
  ${SHOT(P + 'p10-quick-checks.png', 'Quick checks run first, up to about 14 minutes. The change is not sent to Google until they pass.')}
  ${SHOT(P + 'p9-changes-in-review.png', 'Changes in review. Now it is actually on its way.')}

  <h3>5. It is the wrong link</h3>
  <p>The opt-in link is not your store link. Play Console hands you two links
  and they are not interchangeable.</p>

  ${SHOT(P + 'p3-optin-links.png', 'Testers tab, bottom of the page. Join on Android opens Play on the phone. Join on the web is the play.google.com/apps/testing/ link. Send the web one, because a tester who has not opted in yet cannot find the app by searching Play.')}

  <h3>6. Wrong account on the phone</h3>
  <p>The account that joined the group has to be the account Play is signed in
  to on the device. On a phone with two accounts this is the usual culprit, and
  the opt-in page gives the same App not available either way.</p>

  <h3>What it looks like when it works</h3>
  <p>Worth knowing, because none of these pages say the word "success" and
  people keep clicking looking for confirmation.</p>

  ${SHOT(P + 't6-optin-working.png', 'The opt-in page as it should look. Your developer name, your app, and a Become a tester button.')}
  ${SHOT(P + 't7-you-are-a-tester.png', 'After opting in. You are a tester, and a download it on Google Play link. It can take a few minutes before that link works.')}
  ${SHOT(P + 't8-store-installable.png', 'The store page an opted-in tester sees. A normal listing with an Install button — there is no badge saying this is a test build.')}

  <h2><span class="step">14</span>Not available in your country</h2>

  <p>A closed test only reaches the countries the track targets. If you unticked
  countries while setting the track up, or started with a short list, everyone
  outside it is blocked, and the message they get blames their account rather
  than your settings.</p>

  <h3>What the tester sees</h3>
  <p>This is the cruel part, and the reason nobody reports it correctly. The
  opt-in page keeps working. It still says <b>You are a tester</b> in green.</p>

  ${SHOT(P + 't10-optin-ok-but-blocked.png', 'Opted in, blocked, and told neither. This tester cannot install the app.')}

  <p>They click through to Play and get this instead:</p>

  ${SHOT(P + 't9-store-country-blocked.png', 'No Install button. The line reads "This app is not available for any of your devices" — it blames their phone, and the word country never appears.')}

  <p>So the tester tells you their phone is not supported, or that your app is
  broken. Both times the real answer is on your side of the console.</p>

  <h3>Finding it</h3>
  <p>The count is in the track header, one line under the title.</p>

  ${SHOT(P + 'p1-closed-track-overview.png', 'Track summary. Active, latest release, and the number of countries. If that number is small, this is your problem.')}

  <p>The detail is on the track's <b>Countries / regions</b> tab.</p>

  ${SHOT(P + 'k5-not-targeted-176.png', 'The filter is the diagnostic. This track targets one country and excludes 176. Not targeted has to read 0.')}
  ${SHOT(P + 'k2-not-targeted-filter.png', 'A healthy track for comparison. Targeted 177, Not targeted 0.')}

  <p>To fix it, <b>Edit countries / regions</b>, then the checkbox in the header
  row, which takes every country at once.</p>

  ${SHOT(P + 'k4-japan-only.png', 'The mistake, made on purpose to photograph it. One country ticked. Every tester outside Japan is now blocked, and nothing on this screen warns you.')}
  ${SHOT(P + 'k3-edit-select-all.png', 'Edit mode. The top checkbox selects all 177. Do not work down the list.')}
  ${SHOT(P + 'k6-reselect-all.png', 'The same checkbox repairing a restricted track. Every row still reads Not targeted until you save and submit.')}
  ${SHOT(P + 'k1-countries-all.png', 'Done. 177 targeted, 0 not targeted.')}

  <p>Two things that catch people out:</p>
  <ul>
    <li>Country targeting is <b>per track</b>. Adding a country to production
    does not add it to your closed test, and the reverse is also true.</li>
    <li>Like the tester change above, it is saved but not applied until you
    submit it from Publishing overview.</li>
  </ul>
  <p>The screen the tester actually gets is in
  <a href="/guides/blocked-screens.html">The six screens that stop a tester</a>.</p>

  <div class="part">If you do it in the wrong order</div>

  <h2><span class="step">15</span>What that looks like</h2>
  <p>We did it backwards the first time: built the track, signed the app,
  uploaded the bundle — and only then pressed Next.</p>
  ${SHOT(P + 'x1-four-errors.png', 'Four errors, none of them about the release, found after the bundle was already uploaded.')}
  <p>All four live in Part 2 of this guide. The Dashboard says so, in a line
  most people scroll past: <b>"To start a closed test, finish setting up your
  app."</b></p>
  ${SHOT(P + 'x2-locked.png', 'Closed testing, padlocked. The order was there all along, just below the fold.')}
  <p>The track itself takes ten minutes. The declarations do not. Do them
  first.</p>

  <div class="note" style="margin:26px 0">
    <b>ACT Party</b> is where developers test each other's apps to fill those 12.
    Daily opens are recorded automatically from Android usage, so you can see who
    is actually opening your app instead of guessing.
    <a href="/">Free at actparty.app</a>
  </div>

  <p class="muted" style="font-size:13px">Screens are from Play Console in
  September 2026. Google moves things and rewords buttons often, so a label may
  sit somewhere slightly different by the time you read this.</p>`,
};
