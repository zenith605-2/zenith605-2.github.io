  <h1 style="font-size:28px;margin:0 0 8px">A Google Group for your testers</h1>
  <p class="muted" style="margin:0 0 24px">Create it, connect it, then publish a build</p>

  <p>There are two ways to let people into a closed test: an <b>email list</b> or a
  <b>Google Group</b>. One difference separates them, and it is a big one.</p>

  <ul>
    <li><b>Email list</b> — testers send you their address and you add each one in the console, by hand, every time.</li>
    <li><b>Google Group</b> — you hand out one address and testers join themselves. You do nothing.</li>
  </ul>

  <p>You need twelve of them, so the group is far less work. Three things trip
  people up; here they are in order.</p>

  <h2>1. Create the group</h2>

  <p>At <a href="https://groups.google.com/my-groups" target="_blank" rel="noopener">groups.google.com</a>,
  click Create group. The name is free-form; the email prefix becomes the address
  you hand out.</p>

  ${SHOT('/img/guide-group-1.png', 'The email prefix becomes the group address — myapp-testers@googlegroups.com')}

  <h2>2. This is where most people get it wrong</h2>

  <p>The next screen is the one that matters. Leave the defaults and
  <b>nobody can get in.</b></p>

  ${SHOT('/img/guide-group-2.png', 'Change these two. They default to "Group members" and "Invited users only"')}

  <ul>
    <li><b>Who can search for the group</b> → Anyone on the web</li>
    <li><b>Who can join the group</b> → Anyone can join</li>
  </ul>

  <p>On the defaults a tester who clicks your link only sees
  <b>"Content unavailable"</b>. They cannot tell what they did wrong, and you
  cannot tell why nobody is joining. For a group you already made, the same two
  settings sit under group settings.</p>

  <p class="muted">A Workspace group (groups.google.com/<b>a/yourdomain</b>/g/...)
  usually refuses accounts outside the domain. If your testers come from outside,
  make the group on a personal Google account.</p>

  <h2>3. Connect it in the console</h2>

  <p>Play Console → Test and release → Testing → <b>Closed testing</b> → Manage
  track → <b>Testers</b> tab.</p>

  ${SHOT('/img/guide-console-testers.png', 'Pick Google Groups and paste the group email address')}

  <p>Then press <b>Save</b> at the bottom right. Nothing happens until you do.</p>

  <h2>4. Saving is not enough</h2>

  <p>Here is the second trap. Even with the group connected, the opt-in link stays
  shut until <b>a build is published on that track</b>. Testers see this:</p>

  <ol>

  <p>That is the opt-in link, usually
  <code>play.google.com/apps/testing/your.package</code>. When you register your
  app on ACT Party, fill in <b>both</b> the group address and the opt-in link, and
