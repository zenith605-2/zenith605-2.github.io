  <h1 style="font-size:28px;margin:0 0 8px">Testing a paid app or in-app purchases</h1>
  <p class="muted" style="margin:0 0 24px">Left alone, your testers pay real money. Open it up with test cards or codes.</p>

  <p><b>There are two ways.</b> For things sold inside the app (one-time products and subscriptions),

  tester is a license tester</b>. Ask a swap partner to "check the paywall" without setting this up and
  they stop at the payment sheet, or just close the app.</p>

  <p>We checked with a ₩1,100 test app in November. A regular tester who opts in sees a price button
  where Install would be, and tapping it charges them for real.</p>
  ${PHONE('phone-price', 'A regular tester after opting in. A ₩1,100 button instead of Install (Korean Play Store)')}


  <h2>1. In-app purchases and subscriptions: add license testers</h2>
  <ol>
    <li>In Play Console, open <b>Settings → License testing</b> at the bottom left. It is an account setting, not inside the app.</li>
    <li>Under <b>Google Groups</b>, enter the group you use for the closed test
      (<code>name@googlegroups.com</code>) and save. Everyone in the group becomes a license tester at once.
      Email lists (up to 2,000 addresses) work too.</li>
    <li>The products and subscriptions you want tested must be <b>active</b>. Drafts do not open a purchase sheet.</li>
  </ol>
  ${FIG('en-license', 'A list only counts once its checkbox is ticked. Then Save changes at the bottom right')}
  <p>Testers then see test payment methods such as <b>"Test card, always approves"</b>, with a test purchase
  notice on the sheet. Nobody is charged. A license tester can buy a paid app itself with this test card too.</p>
  <ul>
    <li><b>Test subscriptions renew on a short clock.</b> A plan that would renew monthly renews every 5 minutes in a test (weekly and monthly 5 minutes, yearly 30 minutes),
