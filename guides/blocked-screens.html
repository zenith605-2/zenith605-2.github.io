  en: `

      <b>Who can join the group → Anyone can ask</b>.</li>
    <li class="hot">It always looks fine on the owner's screen. They will never find this alone.</li>

  <p>Where those settings live: <a href="/guides/google-group.html">Set up a Google Group for testers</a>.</p>

  <h2>2. Opt-in — "App not available"</h2>
  ${SHOT(O, 'The opt-in page: a testing version has not been published yet, or is not available for this account.')}
  <p>One of three things.</p>
  <ol>
    <li><b>Wrong account.</b> It has to be the account signed into the phone's Play Store.</li>
    <li><b>The group comes first.</b> With a group, opting in before joining is blocked.</li>
