  <h1 style="font-size:28px;margin:0 0 8px">Nobody opens your app all 14 days</h1>
  <p class="muted" style="margin:0 0 24px">Measured 1 September 2026 · 44 finished trades</p>

  <p>Everyone guesses at this. We can measure it, because the app records daily
  opens automatically from Android's usage stats rather than asking anyone to
  report them.</p>

  <p>Here are 44 test-for-test trades that ran their full 14 days, and how many
  of those days the tester actually opened the app:</p>

  <table>
    <tr><th>Lowest</th><td>0 / 14</td></tr>

    <tr><th>Average</th><td><b>8.5 / 14</b></td></tr>
    <tr><th>Opened every single day</th><td><b>2 of 44</b></td></tr>
  </table>

  <p>One person never opened it at all.</p>

  <h2>Two things follow from this</h2>

  <h3>Your test is probably fine</h3>
  <p>Google counts how long a tester stayed opted in, not how often they opened
  anything — see <a href="/guides/what-google-checks.html">what Google actually
  checks</a>. A tester who missed three days has not broken your test. If
  everyone had to hit 14 of 14, nobody would ever pass.</p>

  <h3>But 0 of 14 is not testing</h3>
  <p>Eight of 14 is a person who used your app. Zero is a person who opted in
  and forgot. Google may not care about the difference. The developer who
  installed <em>your</em> app in exchange does.</p>

  <p>That is the number worth being embarrassed about — not Google's.</p>

  <h2>Why this is hard to see</h2>

  <p>Most tools ask testers to prove it by hand: upload a screenshot, fill in a
  staged feedback form, stay in a locked group. Every one of those adds work,
  and work is exactly what people stop doing on day five.</p>

  <p>Android already keeps a usage log. Reading it costs the tester nothing —
  they open the app, and the day is recorded. That is the only way we got these
  numbers at all.</p>

  <div class="note" style="margin:26px 0">
    <b>ACT Party</b> is free, and browsing the
    <a href="/">app board</a> needs no account.
  </div>

  <p class="muted" style="font-size:13px">
    Numbers are from trades on one account and are a small sample. They are
    real measurements, not estimates, but do not read them as an industry
    average.
  </p>`,
