<script type="module">
import { signIn, myApps, myAppProgress, myExchanges, saveApp, setAppPublic,
         incomingRequests, acceptRequest, fetchStoreMeta, pkgFromUrl, appTesters, testerEmails, markEmailRegistered,
         checkGroup, reportOptin, clearOptinFlag, appIdByPackage, uploadShot,
         myProfile, saveDeveloperName, nudgePeer, uploadImage,
         sendTradeImage, sendSupportImage, blockUser, reportSomething,
         deleteApp, deleteExchange, updateExchange,
         iconHtml, esc, ago, STORE_URL, mountAuth, authReady, cleanUrl,
         myAppHistory, myAppArchives, appDetailRecords, appVersionTimeline,
         appOptinGrid, myAppReviews, addAppReview, deleteAppReview,
         myOneSided, offerTrade,
         dayStrip, peerCheckDays, peerIdentity, myTradeChats, tradeMessages, sendTradeMessage,
         markTradeRead, watchTrade, myFeedbacks, mySentFeedbacks,
         replyFeedback, closeElapsed, sendTradeFeedback,
         supportMessages, sendSupportMessage,
         supportMarkRead, watchSupport, setSetupStep, addExchange } from '/assets/api.js?v=97';
import { t, applyDom, langPicker, wireLangPicker, LANG } from '/assets/i18n.js?v=97';

document.getElementById('langSlot').innerHTML = langPicker();
applyDom();
wireLangPicker();
mountAuth('authSlot', t);

const root = document.getElementById('root');
const BASE_TITLE = document.title;

// 구글이 오류를 실어 보내면 조용히 로그인 화면만 뜬다 — 이유를 보여준다.
const qp = new URLSearchParams(
  (location.hash.startsWith('#') ? location.hash.slice(1) : '') + '&' +
  (location.search.startsWith('?') ? location.search.slice(1) : ''));
const authErr = qp.get('error_description') || qp.get('error');
// 앱보드에서 "내 앱 등록"으로 들어오면 곧바로 등록 폼을 편다
const wantNew = qp.has('new');

const user = await authReady();
const uid = user?.id ?? null;
cleanUrl();

const TABS = [
  ['apps', 'tab_myapps'], ['testing', 'tab_testing'], ['offers', 'tab_offers'],
  ['chats', 'tab_chats'], ['feedback', 'tab_feedback'],
  ['history', 'tab_history'], ['contact', 'tab_contact'],
];

let D = {};
// 알림에서 #chat=<request_id> 로 들어오면 그 방을 바로 연다
const deepChat = (location.hash.match(/^#chat=(.+)$/) || [])[1] || null;
let tab = deepChat ? 'chats' : (location.hash || '#apps').slice(1);
let fbTab = 'in';
let unwatch = null;

if (!user) {
  root.innerHTML = `
    <div class="card narrow" style="margin:40px auto;text-align:center">
      <h1 style="font-size:22px;margin:0 0 8px">${t('sign_in')}</h1>
      <p class="muted" style="margin:0 0 18px">${t('app_note')}</p>
      <button class="btn" id="login">Google</button>
      ${authErr ? `<p style="margin:14px 0 0;color:var(--rose);font-size:13px">${esc(authErr)}</p>` : ''}
    </div>`;
  document.getElementById('login').onclick = () => signIn().catch(e => alert(e.message));
  // 로그인 왕복 뒤에도 등록 폼을 열어 주려고 표시를 남긴다
  if (wantNew) sessionStorage.setItem('act_new', '1');
} else {
  const openNew = wantNew || sessionStorage.getItem('act_new') === '1';
  sessionStorage.removeItem('act_new');
  try {
    await load();
    render();
    if (deepChat) {
      const c = D.chats.find((x) => x.request_id === deepChat);
      openChat(deepChat, c?.peer_name || c?.peer_app_name || '');
    }
    if (openNew) appForm(null);
    // 앱이 없는 계정은 다른 곳을 먼저 만지기 전에 등록부터 — 앱과 같은 순서다
    else if (noApps()) { tab = 'apps'; render(); appForm(null); }
    // 새 신청·메시지가 오면 새로고침 없이 배지가 오른다
    setInterval(refreshCounts, 45000);
    addEventListener('focus', refreshCounts);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshCounts();
    });
  } catch (e) {
    root.innerHTML = `<div class="card"><p style="margin:0;color:var(--rose)">
      ${esc(e?.message || String(e))}</p></div>`;
    throw e;
  }
}

// ---- 데이터 ----
async function load() {
  await closeElapsed();
  const [apps, prog, ex, incoming, chats, fbIn, fbOut, prof] = await Promise.all([
    myApps().catch(() => []),
    myAppProgress().catch(() => []),
    myExchanges().catch(() => []),
    incomingRequests().then(r => r.filter(x => (x.status ?? 'pending') === 'pending'))
      .catch(() => []),
    myTradeChats().catch(() => []),
    myFeedbacks().catch(() => []),
    mySentFeedbacks().catch(() => []),
    myProfile().catch(() => null),
  ]);
  // 한쪽만 걸린 품앗이 — 상대가 열어도 기록될 자리가 없는 것들
  const oneSided = await myOneSided().catch(() => []);
  // 상대가 내 앱을 연 날 — 상호 인증이면 달력 아래 줄에 파란 칸으로 함께 보인다
  const pkgs = [...new Set(ex.map(e => e.peer_package).filter(Boolean))];
  const [peer, peerInfo] = await Promise.all([
    peerCheckDays(pkgs).catch(() => ({})),
    peerIdentity(ex.map(e => e.id)).catch(() => ({})),
  ]);
  D = { apps, prog: Object.fromEntries(prog.map(p => [p.app_id, p])),
        ex, incoming, chats, fbIn, fbOut, peer, peerInfo, prof,
        oneSided: Object.fromEntries(oneSided.map(o => [o.exchange_id, o])) };
}

// ---- 탭 ----
/// t() 문구 안의 {a} {b} 를 값으로 바꾼다
function tf(key, vars) {
  return Object.entries(vars)
    .reduce((acc, [k, v]) => acc.replace('{' + k + '}', v), t(key));
}

function badge(n) {
  return n > 0 ? `<span class="tag mint" style="margin-left:5px">${n}</span>` : '';
}

addEventListener('popstate', () => {
  if (!uid || !D.apps) return;   // 로그인 전에는 그릴 것이 없다
  const m = location.hash.match(/^#chat=(.+)$/);
  if (m) {
    const c = D.chats?.find((x) => x.request_id === m[1]);
    tab = 'chats';
    openChat(m[1], c?.peer_name || c?.peer_app_name || '');
    return;
  }
  const h = (location.hash || '#apps').slice(1);
  if (TABS.some(([k]) => k === h) && h !== tab) { tab = h; render(); }
});

function countsOf() {
  return {
    apps: D.apps.length, testing: D.ex.length, offers: D.incoming.length,
    chats: D.chats.reduce((a, c) => a + (c.unread || 0), 0),
    feedback: D.fbIn.filter(f => f.is_new).length,
  };
}

/// 안 읽은 것들을 탭 배지와 브라우저 탭 제목에 반영한다.
/// 제목에도 넣는 이유는, 이 탭을 뒤에 놔둔 채 다른 일을 하기 때문이다.
function paintCounts() {
  const c = countsOf();
  document.querySelectorAll('.tabs [data-tab]').forEach(b => {
    const n = c[b.dataset.tab] || 0;
    let dot = b.querySelector('.tag');
    if (n > 0) {
      if (!dot) {
        dot = document.createElement('span');
        dot.className = 'tag mint';
        dot.style.marginLeft = '5px';
        b.appendChild(dot);
      }
      dot.textContent = n;
    } else if (dot) dot.remove();
  });
  const news = c.offers + c.chats + c.feedback;
  document.title = (news > 0 ? `(${news}) ` : '') + BASE_TITLE;
}

/// 새 신청·메시지·피드백만 가볍게 다시 센다 (앱 목록·달력은 건드리지 않는다)
async function refreshCounts() {
  const [incoming, chats, fbIn] = await Promise.all([
    incomingRequests().then(r => r.filter(x => (x.status ?? 'pending') === 'pending'))
      .catch(() => D.incoming),
    myTradeChats().catch(() => D.chats),
    myFeedbacks().catch(() => D.fbIn),
  ]);
  const before = countsOf();
  D.incoming = incoming; D.chats = chats; D.fbIn = fbIn;
  const after = countsOf();
  paintCounts();
  // 지금 보고 있는 목록에 새 게 생겼으면 그 화면도 다시 그린다
  if (['offers', 'chats', 'feedback'].includes(tab) && after[tab] !== before[tab]) render();
}

function render() {
  if (unwatch) { unwatch(); unwatch = null; }
  const counts = countsOf();
  root.innerHTML = `
    <div class="note" style="margin-bottom:16px">
      ${t('app_note')} <a href="${STORE_URL}" rel="noopener">${t('get_app')}</a>
    </div>
    <div class="tabs">
      ${TABS.map(([k, key]) =>
        `<button class="btn ${k === tab ? '' : 'ghost'} sm" data-tab="${k}">${t(key)}${badge(counts[k])}</button>`).join('')}
    </div>
    <div id="pane"></div>`;

  root.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => {
      tab = b.dataset.tab;
      if (location.hash.slice(1) !== tab) history.pushState({}, '', '#' + tab);
      render();
    };

  });

  const pane = document.getElementById('pane');
  // 주소에 이상한 해시가 들어와도 죽지 않게
  ({ apps: paneApps, testing: paneTesting, offers: paneOffers,
     chats: paneChats, feedback: paneFeedback, history: paneHistory,
     contact: paneContact }[tab] || paneApps)(pane);
  paintCounts();
}

// ---- 내 앱 (여러 개) ----
/// 웹만 쓰는 사람은 인증이 안 잡힌다 — 상대 화면에 [기록 없음]으로 뜬다.
/// 성실히 테스트해도 못 미더운 사람이 되는 자리라, 여기가 제일 큰 누수다.
/// 앱 등록을 막 끝낸 사람에게. 여기까지 온 사람은 의지가 있는 사람이라
/// 이 순간이 앱을 깔 확률이 제일 높다. 다시 입력할 게 없다는 걸 못 박는다.
/// [확인]/[취소] 두 버튼짜리 팝업. 앱 쪽 AlertDialog 와 문구·순서를 맞췄다.
function ask({ h, p, ok, no, danger }) {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'lb';
    box.innerHTML = `
      <div class="rptbox" style="max-width:440px" onclick="event.stopPropagation()">
        <p style="margin:0 0 8px;font-weight:800;font-size:16px">${esc(h)}</p>
        <p class="muted" style="margin:0 0 16px;font-size:13px;line-height:1.6">${esc(p)}</p>
        <div class="row" style="gap:8px;justify-content:flex-end">
          <button class="btn ghost" data-no>${esc(no)}</button>
          <button class="btn${danger ? ' rose' : ''}" data-ok>${esc(ok)}</button>
        </div>
      </div>`;
    const done = (v) => { box.remove(); resolve(v); };
    box.onclick = () => done(false);
    box.querySelector('[data-no]').onclick = () => done(false);
    box.querySelector('[data-ok]').onclick = () => done(true);
    document.body.appendChild(box);
    box.querySelector('[data-ok]').focus();
  });
}

/// 앱을 하나도 등록하지 않은 계정 — 새 계정이 [테스트할 앱]에 자기 앱을 올려
/// 놓는 사고가 반복돼서(2026-09-02~03), 앱과 같이 들어오자마자 등록으로 보낸다.
function noApps() { return !D.apps || D.apps.length === 0; }

async function askRegisterFirst() {
  const go = await ask({ h: t('reg_first_h'), p: t('reg_first_p'),
                         ok: t('reg_first_go'), no: t('cancel') });
  if (!go) return;
  tab = 'apps';
  if (location.hash.slice(1) !== 'apps') history.pushState({}, '', '#apps');
  render();
  appForm(null);
}

function regDone() {
  const box = document.createElement('div');
  box.className = 'lb';
  box.innerHTML = `
    <div class="rptbox" style="max-width:460px" onclick="event.stopPropagation()">
      <p style="margin:0 0 8px;font-weight:800;font-size:16px">${t('reg_done_h')}</p>
      <p class="muted" style="margin:0 0 16px;font-size:13px;line-height:1.6">${
        t('reg_done_p')}</p>
      <div class="row" style="gap:8px">
        <a class="btn" href="${STORE_URL}" target="_blank" rel="noopener">${
          t('noapp_btn')}</a>
        <button class="btn ghost" id="regLater">${t('reg_done_no')}</button>
      </div>
    </div>`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
  box.querySelector('#regLater').onclick = () => box.remove();
}

function noAppBanner() {
  if (D.prof?.usage_access) return '';
  return `<div class="note warn" style="margin-bottom:14px">
    <p style="margin:0;font-weight:700">⚠ ${t('noapp_h')}</p>
    <p style="margin:6px 0 10px">${t('noapp_p')}</p>
    <a class="btn sm" href="${STORE_URL}" target="_blank"
       rel="noopener">${t('noapp_btn')}</a>
  </div>`;
}

function paneApps(pane) {
  const who = D.prof?.developer_name || D.prof?.nickname || '';
  pane.innerHTML = noAppBanner() + `
    <div class="card whoami">
      <div style="min-width:0;flex:1">
        <p class="muted" style="margin:0">${t('dev_name')}</p>
        <p style="margin:2px 0 0;font-weight:700" id="whoName">${esc(who)}</p>
      </div>
      <button class="btn ghost sm" id="whoEdit">${t('edit')}</button>
    </div>
    <p style="margin:14px 0"><button class="btn" id="add">＋ ${t('register_app')}</button></p>
    <div class="grid" id="mine"></div>`;

  document.getElementById('whoEdit').onclick = async () => {
    const v = prompt(t('dev_name') + ' — ' + t('dev_name_p'), who);
    if (v == null) return;
    try {
      const saved = await saveDeveloperName(v);
      D.prof = { ...(D.prof || {}), developer_name: saved };
      document.getElementById('whoName').textContent = saved;
      // 헤더에도 같은 이름이 떠 있다
      const h = document.querySelector('#authSlot a[href="/console.html"]');
      if (h && !h.classList.contains('mine')) h.textContent = saved;
      document.querySelectorAll('#authSlot a').forEach((el) => {
        if (!el.classList.contains('mine') && el.getAttribute('href') === '/console.html') {
          el.textContent = saved;
        }
      });
    } catch (e) { alert(e.message || e); }
  };

  document.getElementById('mine').innerHTML = D.apps.length ? D.apps.map(a => {
    const p = D.prog[a.id] || {};
    const now = p.testing_now ?? 0;
    const est = p.trade_estimated ?? 0;
    return `<div class="card app-card" id="card-${a.id}">
      ${iconHtml(a.icon_url, a.name)}
      <div style="min-width:0;flex:1">
        <p class="app-name">${esc(a.name)}</p>
        <p class="muted">${esc(a.package_name || '—')}</p>
        ${a.optin_broken_at ? `<div class="note warn" style="margin-top:8px">
          <p style="margin:0;font-weight:700">⚠ ${t('optin_fix_h')} (${a.optin_reports || 1})</p>
          <p style="margin:4px 0 8px">${t('optin_fix_p')}</p>
          <button class="btn sm" data-fixed="${a.id}">${t('optin_fixed')}</button>
        </div>` : ''}
        ${progressLine(p, D.ex.filter(e => e.my_app_id === a.id))}
        <div class="row" style="margin-top:10px">
          <label class="chk">
            <input type="checkbox" data-pub="${a.id}" ${a.is_public !== false ? 'checked' : ''}>
            ${t('on_board')}
          </label>
          <button class="btn ghost sm" data-edit="${a.id}">${t('edit')}</button>
          <button class="btn ghost sm" data-delapp="${a.id}">${t('delete')}</button>
          ${a.package_name ? `<a class="btn ghost sm" target="_blank"
            href="/a/${encodeURIComponent(a.package_name)}/">${t('public_page')}</a>
          <button class="btn ghost sm" data-copy="${esc(a.package_name)}">${
            t('copy_link')}</button>` : ''}
        </div>
        ${a.package_name ? `<p class="hint" style="margin:8px 0 0">${
          t('share_hint')}</p>` : ''}
        <div class="grid-d" data-grid="${a.id}">
          <div class="gridbody"><p class="muted">${t('loading')}</p></div>
        </div>
        <details class="testers emails" data-app="${a.id}">
          <summary>${t('emails_h')}</summary>
          <div class="tbody"><p class="hint">…</p></div>
        </details>
      </div></div>`;
  }).join('') : `<p class="muted">${t('no_apps')}</p>`;

  // 링크 하나가 홍보 도구다 — 앱마다 미리보기가 붙는 주소가 이미 있다.
  // 개발자 24명이 각자 뿌리는 게 우리가 혼자 알리는 것보다 넓다.
  pane.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = async () => {
      const url = `${location.origin}/a/${encodeURIComponent(b.dataset.copy)}/`;
      try { await navigator.clipboard.writeText(url); } catch (_) {}
      const was = b.textContent;
      b.textContent = t('copied');
      setTimeout(() => { b.textContent = was; }, 1500);
    };
  });

  wireGrids(pane);

  // 그룹스 대신 이메일 목록으로 테스터를 받는 앱 — 모바일 요청함과 같은 흐름이다.
  // 미등록 이메일을 한 번에 복사해서 Play Console 테스터 목록에 붙여넣는다.
  pane.querySelectorAll('details.emails').forEach(d => {
    d.addEventListener('toggle', () => { if (d.open) loadEmails(d); });
  });

  pane.querySelectorAll('[data-pub]').forEach(cb => {
    cb.onchange = async () => {
      try { await setAppPublic(cb.dataset.pub, cb.checked); }
      catch (e) { alert(e.message); cb.checked = !cb.checked; }
    };
  });
  pane.querySelectorAll('[data-fixed]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await clearOptinFlag(b.dataset.fixed); await load(); render(); }
      catch (e) { alert(e.message); b.disabled = false; }
    };
  });
  pane.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => appForm(D.apps.find(x => x.id === b.dataset.edit));
  });
  pane.querySelectorAll('[data-delapp]').forEach(b => {
    b.onclick = async () => {
      if (!confirm(t('del_app_ask'))) return;
      b.disabled = true;
      try { await deleteApp(b.dataset.delapp); await load(); render(); }
      catch (e) { alert(e.message); b.disabled = false; }
    };
  });
  document.getElementById('add').onclick = () => appForm(null);
}


/// 모바일 _ServerAppCard._progressLine 과 같은 구성.
/// "3명 테스트 중 (확인 2 · 외부 1) · 파티 D+5 · 오늘 5/12 인증 · 품앗이 3건"
function progressLine(p, exs) {
  const f = tf;
  const now = p.testing_now ?? 0;
  const est = p.trade_estimated ?? 0;
  const parts = [];
  if (now > 0) {
    parts.push(`${now}${t('testers_now')}` +
      (est > 0 ? ` (${now - est} ${t('confirmed')} · ${est} ${t('outside')})` : ''));
  }
  if (p.party_name) {
    if (p.party_status === 'running' && (p.day_no ?? 0) > 0) {
      parts.push(`${p.party_name} D+${p.day_no}`);
      parts.push(f('prog_today', { a: p.verified_today ?? 0, b: p.party_testers ?? 0 }));
      if ((p.active_testers ?? 0) < (p.party_testers ?? 0)) {
        parts.push(f('prog_active', { a: p.active_testers ?? 0 }));
      }
    } else {
      const st = { running: 'st_running', recruiting: 'st_recruit' }[p.party_status] || 'st_done';
      parts.push(`${p.party_name} · ${t(st)}`);
    }
  }
  // 내 앱 카드다 — 세는 쪽은 '내 앱을 테스트하는 사람'이어야 한다.
  // exs(내가 거는 품앗이)로 세고 있어서 앱은 5, 웹은 6이 나왔다.
  // 같은 자리에서 다른 걸 세면 둘 중 하나가 틀린 것처럼 보인다.
  const trades = (p.trade_count ?? 0) + (p.trade_done ?? 0);
  if (trades > 0) {
    const done = p.trade_done ?? 0;
    parts.push(f('prog_trades', { a: trades }) +
      (done > 0 ? ` (${f('prog_done', { a: done })})` : ''));
  }
  const running = parts.length > 0;
  if (!running) parts.push(t('prog_none'));
  return `<p class="count prog ${running ? 'on' : ''}">${parts.join(' · ')}</p>`;
}


async function loadEmails(d) {
  const appId = d.dataset.app;
  const box = d.querySelector('.tbody');
  const rows = await testerEmails(appId).catch(() => []);
  const pending = rows.filter(r => !r.registered);
  if (!rows.length) { box.innerHTML = `<p class="muted">${t('emails_none')}</p>`; return; }
  box.innerHTML = `
    ${pending.length ? `<div class="note" style="margin:8px 0">
      <p style="margin:0;font-weight:700">${tf('emails_copy', { a: pending.length })}</p>
      <p class="muted" style="margin:2px 0 8px">${t('emails_copy_p')}</p>
      <div class="row">
        <button class="btn sm" id="cp-${appId}">📋 ${pending.length}</button>
        <a class="btn ghost sm" href="https://play.google.com/console" target="_blank"
           rel="noopener">${t('emails_open')}</a>
      </div></div>` : ''}
    ${rows.map(r => `<div class="trow">
      <div style="min-width:0;flex:1">
        <p style="margin:0;font-size:14px;word-break:break-all">${esc(r.email)}</p>
        <p class="muted" style="margin:0">${r.registered ? t('em_done') : t('em_wait')}</p>
      </div>
      <label class="chk"><input type="checkbox" data-em="${r.tester_id}"
        ${r.registered ? 'checked' : ''}></label>
    </div>`).join('')}`;

  const cp = box.querySelector(`#cp-${CSS.escape(appId)}`);
  if (cp) cp.onclick = async () => {
    const text = pending.map(r => r.email).join(', ');
    try { await navigator.clipboard.writeText(text); cp.textContent = t('copied'); }
    catch (_) { prompt(t('emails_copy_p'), text); }
  };
  box.querySelectorAll('[data-em]').forEach(cb => {
    cb.onchange = async () => {
      try { await markEmailRegistered(appId, cb.dataset.em, cb.checked); }
      catch (e) { alert(e.message); cb.checked = !cb.checked; }
    };
  });
}

// ---- 테스트 중 (달력) ----
/// 여기에 자기 앱을 넣는 사람이 계속 나온다. 내 앱이 없으면 폼을 아예 안 연다.
async function addTradeClick() {
  if (!noApps()) { tradeForm(); return; }
  const go = await ask({ h: t('trade_need_h'), p: t('trade_need_p'),
                         ok: t('trade_need_go'), no: t('cancel') });
  if (!go) return;
  tab = 'apps';
  if (location.hash.slice(1) !== 'apps') history.pushState({}, '', '#apps');
  render();
  appForm(null);
}

function paneTesting(pane) {
  const head = noAppBanner() + `<p style="margin:0 0 14px">
    <button class="btn" id="addTrade">＋ ${t('add_trade')}</button></p>`;
  if (!D.ex.length) {
    pane.innerHTML = head + `<p class="muted">${t('no_tests')}</p>`;
    document.getElementById('addTrade').onclick = addTradeClick;
    return;
  }
  // 그냥 나열하면 어느 앱 대신 테스트 중인지가 안 보인다. 내 앱별로 묶는다.
  const byApp = new Map();
  for (const e of D.ex) {
    const k = e.my_app_id || '';
    if (!byApp.has(k)) byApp.set(k, []);
    byApp.get(k).push(e);
  }
  const appOf = (id) => D.apps.find(a => a.id === id);
  const nameOf = (id) => appOf(id)?.name || t('no_my_app');
  // 품앗이가 서른 건이 넘으면 스크롤만 길어진다. 내 앱별로 접었다 편다.
  pane.innerHTML = head + [...byApp.entries()].map(([appId, list], gi) => `
    <details class="grp" ${gi === 0 ? 'open' : ''}>
      <summary>
        ${iconHtml(appOf(appId)?.icon_url, nameOf(appId))}
        <b>${esc(nameOf(appId))}</b>
        <span class="muted">↔ ${list.length}</span>
      </summary>
    <div class="grid">${list.map((e, ei) => {
    const days = (e.exchange_checkins || []).length;
    const total = e.days ?? 14;
    const pd = D.peer[e.peer_package];
    const dayNo = e.started_on
      ? Math.floor((Date.now() - new Date(e.started_on + 'T00:00:00')) / 86400000) + 1 : 0;
    // 앱과 같은 규칙 — 끝난 품앗이는 눈에 덜 띄게, 중도 이탈은 붉게.
    // 그리고 "언제까지 두고 언제 지워도 되는지"가 카드에서 제일 급한 정보다.
    const left = total - dayNo + 1;
    const until = e.started_on
      ? new Date(new Date(e.started_on + 'T00:00:00').getTime()
                 + (total - 1) * 86400000) : null;
    const untilTxt = until ? `${until.getMonth() + 1}/${until.getDate()}` : '';
    return `<div class="card trade ${e.status === 'done' ? 'is-done'
              : e.uninstalled_at ? 'is-gone' : ''}">
      <div class="app-card" style="align-items:center;gap:10px">
        <span class="numicon">${iconHtml(e.peer_icon_url, e.peer_app_name || '?')}
          <i>${ei + 1}</i></span>
        <div style="min-width:0;flex:1">
      <p class="tname"><b>${esc(e.peer_app_name || '')}</b>
        ${e.uninstalled_at ? `<span class="tag rose">${t('t_uninstalled')}</span>` : ''}
        ${e.status === 'done' ? `<span class="tag mint">${t('t_finished')}</span>` : ''}
        ${peerStatus(e)}
        <span class="keep ${left <= 0 ? 'ok' : ''}">${left <= 0
          ? `✓ ${t('period_done')}`
          : tf('keep_until', { d: untilTxt, n: left })}</span></p>
      ${e.peer_package ? `<p class="muted" style="margin:0;font-size:12px">${esc(e.peer_package)}</p>` : ''}
      <p class="muted" style="margin:0">D+${dayNo} / ${total}${t('days')} ·
        ${t('me')} ${days}${t('days')}${pd ? ` · ${t('them')} ${Object.keys(pd).length}${t('days')}` : ''}</p>
      ${peerLine(e)}
        </div>
      </div>
      ${oneSidedNote(e)}
      ${dayStrip(e, pd)}
      <p class="strip-note">${t('strip_note')}${pd ? t('strip_note_peer') : ''}</p>
      <div class="row" style="margin-top:12px">
        ${/* 버튼을 없애면 그 기능이 있는 줄도 모른다. 자리에 두고 왜 안 되는지 붙인다 */''}
        ${e.trade_request_id
          ? `<button class="btn ghost sm" data-tchat="${e.trade_request_id}"
               data-title="${esc(e.peer_app_name || '')}">${t('open_chat')}</button>`
          : `<button class="btn ghost sm" disabled
               title="${esc(t('dis_nochat'))}">${t('open_chat')}</button>`}
        ${e.peer_package
          ? `<button class="btn ghost sm" data-tfb="${e.id}"
               data-pkg="${esc(e.peer_package)}">${t('write_fb')}</button>`
          : `<button class="btn ghost sm" disabled
               title="${esc(t('dis_nopkg'))}">${t('write_fb')}</button>`}
        ${e.status !== 'done'
          ? `<button class="btn ghost sm" data-nudge="${e.id}"
               title="${esc(t('nudge_tip'))}">${t('nudge')}</button>`
          : `<button class="btn ghost sm" disabled
               title="${esc(t('dis_done'))}">${t('nudge')}</button>`}
        <button class="btn ghost sm" data-tedit="${e.id}">${t('edit')}</button>
        <button class="btn ghost sm" data-tdel="${e.id}">${t('delete')}</button>
      </div>
      <div class="fbbox" id="fb-${e.id}"></div>
      ${setupSteps(e)}
      ${!e.setup_install_done && !days && e.peer_package ? `<div class="gate">
        <p style="margin:0 0 7px">${t('optin_q')}</p>
        <div class="row">
          ${e.peer_optin_url ? `<a class="btn ghost sm" href="${esc(e.peer_optin_url)}"
             target="_blank" rel="noopener">${t('f_optin')} ↗</a>` : ''}
          <button class="btn sm" data-oi="1" data-pkg="${esc(e.peer_package)}">${t('optin_yes')}</button>
          <button class="btn ghost sm" data-oi="0" data-pkg="${esc(e.peer_package)}">${t('optin_no')}</button>
        </div></div>` : ''}
    </div>`;
  }).join('')}</div></details>`).join('');

  document.getElementById('addTrade').onclick = addTradeClick;

  // 신청을 보내면 상대가 수락할 때 서버가 양쪽을 만들어 준다
  pane.querySelectorAll('[data-offer]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        await offerTrade(b.dataset.offer, b.dataset.my || null, '');
        b.outerHTML = `<span class="muted" style="font-size:12px">${t('os_done')}</span>`;
      } catch (err) { b.disabled = false; alert(err.message || err); }
    };
  });

  pane.querySelectorAll('[data-tchat]').forEach(b => {
    b.onclick = () => openChat(b.dataset.tchat, b.dataset.title);
  });

  // 찌르기 — 서버가 조건을 보고 결과를 돌려준다. 왜 안 되는지도 말해 준다.
  pane.querySelectorAll('[data-nudge]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await nudgePeer(b.dataset.nudge);
        alert(t({ ok: 'nudge_ok', self: 'nudge_self', already: 'nudge_already',
                  sent_today: 'nudge_today', nopeer: 'nudge_nopeer' }[r] || 'nudge_ok'));
      } catch (e) { alert(e.message); }
      b.disabled = false;
    };
  });

  pane.querySelectorAll('[data-tedit]').forEach(b => {
    b.onclick = () => tradeForm(D.ex.find(x => x.id === b.dataset.tedit));
  });
  pane.querySelectorAll('[data-tdel]').forEach(b => {
    b.onclick = async () => {
      if (!confirm(t('del_trade_ask'))) return;
      b.disabled = true;
      try { await deleteExchange(b.dataset.tdel); await load(); render(); }
      catch (e) { alert(e.message); b.disabled = false; }
    };
  });

  // 테스트하면서 바로 남기는 게 제일 쓸모 있는 피드백이다.
  // 앱 화면과 같은 자리에 두지 않으면 아무도 안 쓴다.
  pane.querySelectorAll('[data-tfb]').forEach(b => {
    b.onclick = async () => {
      const box = document.getElementById(`fb-${b.dataset.tfb}`);
      if (box.dataset.open) { box.innerHTML = ''; delete box.dataset.open; return; }
      box.dataset.open = '1';
      box.innerHTML = `<p class="hint">…</p>`;
      const appId = await appIdByPackage(b.dataset.pkg).catch(() => null);
      if (!appId) { box.innerHTML = `<p class="hint bad">${t('no_app_found')}</p>`; return; }
      box.innerHTML = `
        <p class="hint" style="margin:0 0 6px">${t('write_fb_p')}</p>
        <textarea rows="3" maxlength="2000"></textarea>
        <p style="margin:8px 0 0"><button class="btn sm">${t('send')}</button></p>`;
      const ta = box.querySelector('textarea');
      box.querySelector('button').onclick = async (ev) => {
        const body = ta.value.trim();
        if (!body) return;
        ev.target.disabled = true;
        try {
          await sendTradeFeedback(b.dataset.tfb, appId, body);
          box.innerHTML = `<p class="hint ok">${t('fb_sent')}</p>`;
          delete box.dataset.open;
        } catch (e) { alert(e.message || e); ev.target.disabled = false; }
      };
    };
  });

  // 그룹 가입과 옵트인은 웹에서도 끝낼 수 있다
  pane.querySelectorAll('[data-step]').forEach(cb => {
    cb.onchange = async () => {
      try { await setSetupStep(cb.dataset.ex, cb.dataset.step, cb.checked); }
      catch (err) { alert(err.message); cb.checked = !cb.checked; }
    };
  });

  // 옵트인이 되는지는 밖에서 볼 방법이 없다(옵트인 페이지가 정상 앱이든
  // 아니든 똑같이 응답한다). 첫 테스터가 한 번 눌러 주면 그게 유일한 신호다.
  pane.querySelectorAll('[data-oi]').forEach(b => {
    b.onclick = async () => {
      const box = b.closest('.gate');
      box.innerHTML = `<p class="hint">…</p>`;
      const appId = await appIdByPackage(b.dataset.pkg).catch(() => null);
      if (!appId) { box.remove(); return; }
      try { await reportOptin(appId, b.dataset.oi === '1'); } catch (_) {}
      box.innerHTML = b.dataset.oi === '1' ? '' : `<p class="hint ok">${t('optin_thanks')}</p>`;
    };
  });
}

/// 수락한 뒤에 할 일 셋. 그룹 가입과 옵트인은 여기서 링크를 열고 체크하면
/// 끝나고, 설치만 안드로이드 앱이 확인한다(사용 기록을 읽어야 알 수 있다).
function setupSteps(e) {
  if (e.setup_group_done && e.setup_optin_done && e.setup_install_done) return '';
  const row = (label, done, link, field) => `
    <div class="stp${done ? ' done' : ''}">
      ${field
        ? `<label class="chk"><input type="checkbox" data-ex="${e.id}"
             data-step="${field}" ${done ? 'checked' : ''}> ${label}</label>`
        : `<span>${done ? '✓' : '·'} ${label}</span>`}
      ${link ? `<a class="btn ghost sm" href="${esc(link)}" target="_blank"
                  rel="noopener">↗</a>` : ''}
    </div>`;
  return `<div class="setup">
    <p class="step" style="margin:0 0 6px">${t('setup_h')}</p>
    ${row(t('step_group'), !!e.setup_group_done, e.peer_group_url, 'setup_group_done')}
    ${row(t('step_optin'), !!e.setup_optin_done, e.peer_optin_url, 'setup_optin_done')}
    ${row(t('step_install'), !!e.setup_install_done,
          e.peer_package
            ? `https://play.google.com/store/apps/details?id=${encodeURIComponent(e.peer_package)}`
            : null, null)}
    ${!e.setup_install_done ? `
      <p class="hint" style="margin:6px 0 0">${t('step_install_p')}</p>
      ${e.peer_package ? `<p style="margin:8px 0 0">
        <a class="btn ghost sm"
           href="https://play.google.com/store/apps/details?id=${encodeURIComponent(e.peer_package)}"
           target="_blank" rel="noopener">${t('step_install_web')} ↗</a></p>
        <p class="hint" style="margin:6px 0 0">${t('step_install_web_p')}</p>` : ''}` : ''}
  </div>`;
}

/// 테스트할 앱 넣기. [내 앱]에는 내 앱만, 여기에는 테스트할 앱만 넣는다 —
/// 한 폼에서 둘 다 받으면 매번 무엇을 넣는 화면인지 설명해야 한다.
function tradeForm(existing) {
  const x = existing || {};
  const pane = document.getElementById('pane');
  document.getElementById('tradeCard')?.remove();
  const opts = D.apps.map((m) =>
    `<option value="${m.id}" ${m.id === x.my_app_id ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  pane.insertAdjacentHTML('afterbegin', `
    <div class="card" id="tradeCard" style="margin-bottom:18px">
      <h2 style="font-size:18px;margin:0 0 4px">${existing ? t('edit') : t('add_trade')}</h2>
      <p class="muted" style="margin:0">${t('add_trade_p')}</p>

      <!-- 테스터가 실제로 밟는 순서: 그룹 가입 → 옵트인 → 설치 -->
      <label>${t('f_group')} <span class="muted">${t('optional_h')}</span></label>
      <div class="row">
        <input type="url" id="x_group" style="flex:1;min-width:190px"
               value="${esc(x.peer_group_url || '')}"
               placeholder="https://groups.google.com/g/...">
        <button class="btn ghost sm" id="x_gchk">${t('grp_check')}</button>
      </div>
      <p class="hint" id="x_gmsg"></p>

      <label>${t('f_optin')} <span class="req">${t('req')}</span></label>
      <div class="row">
        <input type="url" id="x_optin" style="flex:1;min-width:190px"
               value="${esc(x.peer_optin_url || '')}"
               placeholder="https://play.google.com/apps/testing/com.example.app">
        <button class="btn sky sm" id="x_fetch">${t('fetch')}</button>
      </div>
      <div id="x_prev"></div>

      <label>${t('f_store')} <span class="muted">${t('optional_h')}</span></label>
      <input type="text" id="x_store" value="${esc(x.peer_package || '')}"
             placeholder="https://play.google.com/store/apps/details?id=...">

      <label>${t('f_peer_name')} <span class="muted">${t('optional_h')}</span></label>
      <input type="text" id="x_name" value="${esc(x.peer_app_name || '')}">
      <p class="hint">${t('f_peer_name_p')}</p>

      <div class="row" style="gap:16px;align-items:flex-end">
        <div style="flex:1;min-width:150px">
          <label>${t('f_my_app')}</label>
          <select id="x_mine">
            <option value="">${t('f_my_app_no')}</option>${opts}</select>
        </div>
        <div style="width:110px">
          <label>${t('f_days')}</label>
          <input type="text" id="x_days" value="${x.days ?? 14}" inputmode="numeric">
        </div>
      </div>

      <label>${t('f_source')} <span class="muted">${t('optional_h')}</span></label>
      <input type="text" id="x_source" value="${esc(x.source || '')}"
             placeholder="reddit, telegram, …">

      <div class="row" style="margin-top:16px">
        <button class="btn" id="x_save">${existing ? t('save') : t('add_trade')}</button>
        <button class="btn ghost" id="x_cancel">${t('cancel')}</button>
      </div>
    </div>`);

  const $ = (id) => document.getElementById(id);
  $('tradeCard').scrollIntoView({ block: 'nearest' });
  $('x_cancel').onclick = () => $('tradeCard').remove();

  const fetchNow = async () => {
    // 옵트인 링크에 패키지명이 들어 있다 — 스토어 링크는 없어도 된다
    const pkg = pkgFromUrl($('x_optin').value.trim()) ||
                pkgFromUrl($('x_store').value.trim());
    if (!pkg) { $('x_prev').innerHTML = `<p class="hint">${t('bad_link')}</p>`; return; }
    $('x_prev').innerHTML = '<p class="hint">…</p>';
    if (!$('x_optin').value) $('x_optin').value = `https://play.google.com/apps/testing/${pkg}`;
    try {
      const m = await fetchStoreMeta(pkg);
      if (m?.name) $('x_name').value = m.name;
      $('x_fetch').dataset.icon = m?.icon || '';
      $('x_prev').innerHTML = `<div class="app-card" style="margin-top:12px">
        ${iconHtml(m?.icon, m?.name || pkg)}
        <div style="min-width:0"><p class="app-name">${esc(m?.name || pkg)}</p>
          <p class="muted">${esc(pkg)}</p></div></div>`;
    } catch (_) {
      $('x_prev').innerHTML = `<p class="hint ok">✓ ${esc(pkg)}</p>`;
    }
  };
  $('x_fetch').onclick = fetchNow;
  for (const id of ['x_optin', 'x_store']) {
    $(id).addEventListener('paste', () => setTimeout(fetchNow, 30));
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchNow(); });
  }

  const groupNow = async () => {
    const v = $('x_group').value.trim();
    if (!v) return;
    $('x_gmsg').textContent = '…';
    try {
      const r = await checkGroup(v);
      $('x_gmsg').className = 'hint ' + (r?.ok ? 'ok' : 'bad');
      $('x_gmsg').innerHTML = r?.ok ? `✓ ${esc(r.title)}` : `⚠ ${t('grp_bad')}`;
    } catch (_) { $('x_gmsg').textContent = ''; }
  };
  $('x_gchk').onclick = groupNow;
  $('x_group').addEventListener('blur', groupNow);

  $('x_save').onclick = async (ev) => {
    const pkgNow = pkgFromUrl($('x_optin').value) || pkgFromUrl($('x_store').value) || '';
    // 이름을 모르는 게 정상이다. 비공개 테스트 앱은 스토어에 없으니 확인할
    // 데가 없다. 일단 패키지명으로 넣어 두면, 폰에 깔린 걸 확인하는 순간
    // 안드로이드 앱이 진짜 이름으로 바꿔 준다.
    const name = $('x_name').value.trim() || pkgNow;
    if (!name) { $('x_optin').focus(); alert(t('need_optin')); return; }
    // 내 앱을 여기 넣으면 인증 달력과 완주 수가 뻥튀기된다. 서버도 막지만,
    // 사람이 읽을 문장은 여기서 보여 준다.
    if (!existing && pkgNow && D.apps.some(a =>
        (a.package_name || '').trim().toLowerCase() === pkgNow.trim().toLowerCase())) {
      await ask({ h: t('self_trade_h'), p: t('self_trade_p'),
                  ok: t('ok_btn'), no: t('cancel') });
      return;
    }
    ev.target.disabled = true;
    const row = {
        peer_app_name: name,
        peer_package: pkgFromUrl($('x_optin').value) ||
                      pkgFromUrl($('x_store').value) || null,
        peer_group_url: $('x_group').value.trim() || null,
        peer_optin_url: $('x_optin').value.trim() || null,
        peer_icon_url: $('x_fetch').dataset.icon || null,
        my_app_id: $('x_mine').value || null,
        source: $('x_source').value.trim() || null,
        days: Math.max(1, Math.min(60, Number($('x_days').value) || 14)),
    };
    try {
      if (existing) await updateExchange(existing.id, row);
      else await addExchange(row);
      await load(); tab = 'testing'; render();
    } catch (e) { alert(e.message || e); ev.target.disabled = false; }
  };
}

/// 상대가 내 앱을 어떻게 해 줬는가 — 앱의 카드와 같은 말을 쓴다.
/// 상대 쪽에 내 앱이 안 걸려 있으면 그쪽이 아무리 열어도 잴 자리가 없다.
/// 남의 계정에 몰래 만들 수는 없으니 신청만 보낸다 — 수락은 그쪽이 한다.
function oneSidedNote(e) {
  const o = D.oneSided?.[e.id];
  if (!o || e.status === 'done') return '';
  return `<div class="note warn" style="margin:10px 0 0;padding:10px 12px">
    <p style="margin:0;font-size:12.5px">${t('os_warn')}</p>
    <p style="margin:8px 0 0">${o.already_sent
      ? `<span class="muted" style="font-size:12px">${t('os_sent')}</span>`
      : `<button class="btn sm" data-offer="${esc(o.peer_app_id)}"
           data-my="${esc(e.my_app_id || '')}">${t('os_send')}</button>`}</p>
  </div>`;
}

function peerStatus(e) {
  const k = { done: 'ps_done', confirmed: 'ps_confirmed',
              ghosted: 'ps_ghosted' }[e.peer_status] || 'ps_pending';
  const cls = { ps_done: 'mint', ps_confirmed: 'sky', ps_ghosted: 'rose' }[k] || '';
  return `<span class="tag ${cls}">${t(k)}</span>`;
}

/// 상대가 ACT 사용자인지 — 이게 안 보이면 왜 상대 줄이 비어 있는지,
/// 왜 대화·노크가 막혀 있는지 알 수가 없다.
function peerLine(e) {
  const p = D.peerInfo?.[e.id];
  // 상대가 내 앱을 연 날이 있으면 그 사람은 ACT 사용자다. 이름·패키지가
  // 안 맞아 신원을 못 찾았어도 이건 확실한 증거라, [ACT 밖]으로 두면 거짓말이 된다.
  const proven = !!(e.peer_package && D.peer?.[e.peer_package]);
  if (!p && proven) {
    return `<p class="muted who" style="margin:2px 0 0">
      <span class="tag mint">${t('act_user')}</span></p>`;
  }
  if (!p) {
    return `<p class="muted who" style="margin:2px 0 0">
      <span class="tag">${t('not_act_user')}</span>
      <span class="dim">${t('not_act_p')}</span></p>`;
  }
  // 앱 이름과 같아도 그냥 적는다. 숨겨 봤더니 이모지만 덩그러니 남아서
  // 개발자명을 안 넣은 사람처럼 보였다.
  const nm = p.developer_name || '';
  // 앱 아이콘이 이미 왼쪽에 큼직하게 있다. 여기 또 작은 아이콘을 넣으면
  // 무엇을 가리키는 그림인지 헷갈린다. 사람은 헤더와 같은 이모지로 통일한다.
  return `<p class="muted who" style="margin:2px 0 0">
    <span class="emo">🧑</span>${esc(nm || t('developer'))}
    <span class="tag mint">${t('act_user')}</span>
    ${p.usage_access ? `<span class="tag mint">${t('auto_ok')}</span>`
                     : `<span class="tag rose">${t('auto_off')}</span>`}
    <span class="sep">·</span>
    <span class="dim">${t('karma')} ${p.karma ?? 0} · ${p.completed ?? 0}${t('t_finished')}</span>
    ${p.last_seen_at ? `<span class="sep">·</span>
      <span class="dim">${t('active')} ${ago(p.last_seen_at)}</span>` : ''}</p>`;
}

// ---- 채팅방 ----
async function openChat(requestId, title) {
  if (unwatch) { unwatch(); unwatch = null; }
  if (location.hash !== `#chat=${requestId}`) {
    history.pushState({}, '', `#chat=${requestId}`);
  }
  tab = 'chats';
  const pane = document.getElementById('pane');
  pane.innerHTML = `<div class="card">
    <p style="margin:0 0 10px;display:flex;align-items:center;gap:8px">
      <button class="btn ghost sm" id="backChat">←</button>
      <b style="flex:1;min-width:0">${esc(title)}</b>
      <button class="btn ghost sm" id="cReport">${t('report')}</button>
      <button class="btn ghost sm" id="cBlock">${t('block')}</button></p>
    <div id="msgs" class="msgs"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" id="mPic">${t('photo')}</button>
      <input type="file" id="mFile" accept="image/*" hidden>
      <input type="text" id="mText" placeholder="${t('msg_ph')}" style="flex:1;min-width:150px">
      <button class="btn sm" id="mSend">${t('send')}</button>
    </div></div>`;

  document.getElementById('backChat').onclick = () => {
    history.pushState({}, '', '#chats');
    render();
  };

  const peerId = D.chats.find((c) => c.request_id === requestId)?.peer_id || null;
  document.getElementById('cReport').onclick = async () => {
    const why = prompt(t('report_ask'));
    if (!why) return;
    try { await reportSomething('trade_chat', requestId, peerId, why); alert(t('report_sent')); }
    catch (e) { alert(e.message); }
  };
  document.getElementById('cBlock').onclick = async () => {
    if (!peerId || !confirm(t('block_ask'))) return;
    try { await blockUser(peerId); alert(t('blocked')); }
    catch (e) { alert(e.message); }
  };

  const box = document.getElementById('msgs');
  const draw = (rows) => {
    box.innerHTML = rows.map(m => {
      const own = m.sender_id === uid;
      const at = new Date(m.created_at);
      return `<div class="mrow ${own ? 'own' : ''}">
        <div class="bubble ${own ? 'own' : ''}">
          ${m.image_url ? `<img src="${esc(m.image_url)}" class="mimg">` : ''}
          ${esc(m.body || '')}
          <span class="mt">${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}</span>
        </div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  };

  const rows = await tradeMessages(requestId).catch(() => []);
  draw(rows);
  markTradeRead(requestId);
  unwatch = watchTrade(requestId, (r) => {
    if (!rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
  });

  const send = async () => {
    const el = document.getElementById('mText');
    const text = el.value.trim();
    if (!text) return;
    el.value = '';
    try {
      const r = await sendTradeMessage(requestId, text);
      if (r && !rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
    } catch (e) { alert(e.message); }
  };
  document.getElementById('mSend').onclick = send;
  document.getElementById('mText').addEventListener('keydown',
    (e) => { if (e.key === 'Enter') send(); });

  // 사진 한 장. 스크린샷으로 설명하는 게 글보다 빠를 때가 많다.
  document.getElementById('mPic').onclick = () => document.getElementById('mFile').click();
  document.getElementById('mFile').onchange = async (ev) => {
    const f = ev.target.files?.[0];
    if (!f) return;
    ev.target.value = '';
    try {
      const url = await uploadImage('chat-images', f);
      const r = await sendTradeImage(requestId, url);
      if (r && !rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
    } catch (e) { alert(e.message || e); }
  };
}

/// 비공개 테스트가 끝나면 남는 건 숫자가 아니라 내용이다.
/// 부팅을 늦추지 않으려고 이 탭을 처음 열 때만 받아 온다.
async function paneHistory(pane) {
  if (!D.hist) {
    pane.innerHTML = `<p class="muted">${t('loading')}</p>`;
    const [rows, arc] = await Promise.all([
      myAppHistory().catch(() => []),
      myAppArchives().catch(() => []),
    ]);
    D.hist = rows; D.arc = arc;
    if (tab !== 'history') return;   // 기다리는 사이 다른 탭으로 갔다
  }
  const stat = (label, v, sub) =>
    `<div class="hstat"><b>${v}</b><span>${esc(label)}</span>${
      sub ? `<em>${esc(sub)}</em>` : ''}</div>`;
  // 날짜가 없으면 '아직' — 빈칸으로 두면 고장인지 아직인지 모른다
  const dline = (label, v) => `<div class="hdate"><span>${esc(label)}</span>`
    + `<b class="${v ? '' : 'muted'}">${v ? esc(String(v).slice(0, 10))
      : t('hist_not_yet')}</b></div>`;

  pane.innerHTML = `
    <p class="muted" style="margin:0 0 14px">${t('hist_note')}</p>
    <div class="grid">${D.hist.length ? D.hist.map(r => `
      <div class="card">
        <div class="app-card" style="align-items:center;gap:10px">
          ${iconHtml(r.icon_url, r.app_name || '?')}
          <div style="min-width:0;flex:1">
            <p class="app-name">${esc(r.app_name || '')}</p>
            <p class="muted">${esc(r.package_name || '—')}</p>
          </div>
        </div>
        <div class="hstats">
          ${stat(t('hist_party'), r.party_testers ?? 0)}
          ${stat(t('hist_streak'),
            tf('hist_dnum', { n: r.total_streak_days ?? 0 }),
            `ACT ${tf('hist_dnum', { n: r.streak_days ?? 0 })}`)}
          ${stat(t('hist_trades'),
            (r.trade_count ?? 0) + (r.trade_untracked ?? 0),
            (r.trade_untracked ?? 0) > 0
              ? `ACT ${r.trade_count ?? 0}` : null)}
          ${stat(t('hist_fb'), r.feedback_count ?? 0)}
          ${stat(t('hist_chats'), r.chat_count ?? 0)}
        </div>
        <div class="rvbox" data-rv="${esc(r.app_id)}"></div>
        <div class="grid-d" data-grid="${esc(r.app_id)}">
          <div class="gridbody"><p class="muted">${t('loading')}</p></div>
        </div>
        <details class="recs" data-app="${esc(r.app_id)}">
          <summary>${t('hist_open')}</summary>
          <div class="recbody"><p class="muted">${t('loading')}</p></div>
        </details>
        <p style="margin:10px 0 0">
          <button class="btn ghost sm" data-rpt="${esc(r.app_id)}">${t('hist_export')}</button></p>
      </div>`).join('')
      : `<p class="muted">${t('hist_empty')}</p>`}</div>

    ${D.arc.length ? `
      <h3 class="grp-h">${t('hist_deleted')}</h3>
      <div class="grid">${D.arc.map(a => `
        <div class="card">
          <p style="margin:0 0 4px"><b>${esc(a.app_name || '')}</b>
            <span class="muted" style="font-size:12px">${ago(a.archived_at)}</span></p>
          <p class="muted" style="margin:0;font-size:12px">
            ${t('hist_party')} ${a.party_testers ?? 0} ·
            ${t('hist_trades')} ${a.trade_count ?? 0} ·
            ${t('hist_fb')} ${a.feedback_count ?? 0} ·
            ${t('hist_chats')} ${a.chat_count ?? 0} ·
            ${t('hist_gdays')} ${a.google_days ?? 0}</p>
          ${((a.feedbacks || []).slice(0, 3)).map(f =>
            `<p class="rec" style="margin:6px 0 0">${esc(f.body || '')}</p>`).join('')}
        </div>`).join('')}</div>` : ''}`;

  wireReviews(pane);
  wireGrids(pane);

  pane.querySelectorAll('[data-rpt]').forEach(b => {
    b.onclick = () => exportReport(b.dataset.rpt, b);
  });

  // 펼칠 때 원문을 받는다 — 앱이 여러 개면 한꺼번에 받을 이유가 없다
  pane.querySelectorAll('details.recs').forEach(d => {
    d.addEventListener('toggle', async () => {
      if (!d.open || d.dataset.done) return;
      d.dataset.done = '1';
      const box = d.querySelector('.recbody');
      let rows = [];
      try { rows = await appDetailRecords(d.dataset.app); } catch (_) {}
      // 품앗이·파티 인증은 표가 보여 준다. 여기 남길 건 받은 말뿐이다.
      const kinds = ['feedback', 'chat'];
      const has = kinds.filter(k => rows.some(x => x.kind === k));
      if (!has.length) { box.innerHTML = `<p class="muted">${t('hist_none')}</p>`; return; }
      const one = (x) => `
          <div class="rec${x.mine ? ' mine' : ''}">
            <p class="recwho">${x.mine ? '' :
              iconHtml(x.icon, x.title || '?', 'gicon')}
              <b>${x.mine ? t('rec_me') : esc(x.title || '')}</b>
              <span class="muted" style="font-size:11px">${ago(x.at)}</span></p>
            ${x.body ? `<p style="margin:2px 0 0">${esc(x.body)}</p>` : ''}
          </div>`;
      // 대화는 수백 건이라 쭉 늘어놓으면 못 읽는다 — 상대별로 접어 둔다.
      // rows 는 최신순이라 각 묶음의 첫 줄이 곧 마지막으로 주고받은 말이다.
      const byWho = (list) => {
        const m = new Map();
        for (const x of list) {
          const who = x.title || '?';
          if (!m.has(who)) m.set(who, []);
          m.get(who).push(x);
        }
        return [...m.entries()].map(([who, items]) => `
          <details class="recg">
            <summary>${iconHtml(items[0].icon, who, 'gicon')}<b>${esc(who)}</b>
              <span class="muted">${items.length}</span>
              <span class="muted when">${ago(items[0].at)}</span></summary>
            ${items.map(one).join('')}
          </details>`).join('');
      };
      box.innerHTML = has.map(k => {
        const list = rows.filter(x => x.kind === k);
        return `
        <p class="reckind">${t('kind_' + k)}
          <span class="muted">${list.length}</span></p>
        ${k === 'chat' ? byWho(list) : list.map(one).join('')}`;
      }).join('');
    });
  });
}

/// 표는 펼칠 때만 받는다 — 앱마다 수백 칸이다. 내 앱 탭과 이력 탭이 같이 쓴다.
function wireGrids(pane) {
  // 기본으로 펼쳐 두므로 toggle 만 기다리면 영영 안 받는다 —
  // 열려 있는 건 바로 받고, 접었다 다시 펴는 경우만 toggle 로 받는다.
  const load = async (d) => {
    if (d.dataset.done) return;
    d.dataset.done = '1';
    let rows = [];
    try { rows = await appOptinGrid(d.dataset.grid); } catch (_) {}
    d.querySelector('.gridbody').innerHTML = gridHtml(rows, d.dataset.grid);
  };
  pane.querySelectorAll('.grid-d').forEach(load);
}

/// 프로덕션 신청 결과 — 구글 콘솔 안에서 벌어지는 일이라 우리는 모른다.
/// 본인이 적어 두면 반려된 날부터 다시 세어 준다.
const RESET = new Map();          // appId -> 반려일 목록 (최근 것이 먼저)

async function wireReviews(pane) {
  for (const box of pane.querySelectorAll('.rvbox')) {
    const appId = box.dataset.rv;
    let rows = [];
    try { rows = await myAppReviews(appId); } catch (_) {}
    RESET.set(appId, rows.filter(x => x.result === 'rejected')
      .map(x => x.decided_on));
    paintReviews(box, appId, rows);
  }
}

function paintReviews(box, appId, rows) {
  box.innerHTML = `
    <div class="rvhead">
      <b>${t('rv_h')}</b>
      <button class="btn ghost sm" data-rvadd="${esc(appId)}">${t('rv_add')}</button>
    </div>
    ${rows.length ? rows.map(x => `
      <div class="rvrow">
        <span class="tag ${x.result === 'approved' ? 'mint' : 'rose'}">${
          t(x.result === 'approved' ? 'rv_ok' : 'rv_no')}</span>
        <span>${esc(x.decided_on)}</span>
        ${x.note ? `<span class="muted">${esc(x.note)}</span>` : ''}
        <button class="x" data-rvdel="${x.id}" aria-label="delete">✕</button>
      </div>`).join('')
      : `<p class="muted" style="margin:6px 0 0;font-size:12px">${t('rv_none')}</p>`}
    ${rows.some(x => x.result === 'rejected')
      ? `<p class="muted" style="margin:6px 0 0;font-size:11.5px">${t('rv_reset')}</p>`
      : ''}`;

  box.querySelector('[data-rvadd]').onclick = async () => {
    const ok = confirm(`${t('rv_h')}\n\n${t('rv_ok')} = 확인 / ${t('rv_no')} = 취소`);
    const when = prompt(t('rv_when'), new Date().toISOString().slice(0, 10));
    if (!when) return;
    const note = prompt(t('rv_note'), '') || '';
    try {
      await addAppReview(appId, ok ? 'approved' : 'rejected', when, note);
      const fresh = await myAppReviews(appId);
      RESET.set(appId, fresh.filter(x => x.result === 'rejected')
        .map(x => x.decided_on));
      paintReviews(box, appId, fresh);
      regrid(appId);
    } catch (e) { alert(e.message || e); }
  };
  box.querySelectorAll('[data-rvdel]').forEach(b => {
    b.onclick = async () => {
      if (!confirm(t('rv_del'))) return;
      try {
        await deleteAppReview(Number(b.dataset.rvdel));
        const fresh = await myAppReviews(appId);
        RESET.set(appId, fresh.filter(x => x.result === 'rejected')
          .map(x => x.decided_on));
        paintReviews(box, appId, fresh);
        regrid(appId);
      } catch (e) { alert(e.message || e); }
    };
  });
}

/// 신청 결과가 바뀌면 표의 시작점이 달라진다 — 다시 그린다
function regrid(appId) {
  const d = document.querySelector(`.grid-d[data-grid="${appId}"]`);
  if (!d) return;
  delete d.dataset.done;
  appOptinGrid(appId)
    .then(rows => { d.querySelector('.gridbody').innerHTML = gridHtml(rows, appId); })
    .catch(() => {});
}

/// 표와 리포트가 같은 숫자를 내도록 계산을 한 곳에 둔다.
/// 날짜는 처음부터 끝까지 로컬로 다룬다 — 서버(UTC)와 섞으면 하루가 어긋난다.
function gridStats(rows) {
  const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1)
    .padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const local = (v) => {
    const [y, m, d] = String(v).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  };
  const froms = rows.map(r => r.from_day).filter(Boolean).sort();
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const days = [];
  for (let d = froms.length ? local(froms[0]) : new Date(today);
       d <= today; d.setDate(d.getDate() + 1)) days.push(key(d));

  const on = (r, day) => {
    if (!r.from_day || day < r.from_day) return false;
    if (r.to_day && day >= r.to_day) return false;
    return true;
  };
  const mine = rows.filter(r => r.tracked);
  const okN = (d) => mine.filter(r => on(r, d)).length;
  const allN = (d) => rows.filter(r => on(r, d)).length;
  const firstAt = (fn) => days.find(d => fn(d) >= 12) || '';
  const runOf = (fn) => {
    let k = 0;
    for (let i = days.length - 1; i >= 0 && fn(days[i]) >= 12; i--) k++;
    return k;
  };
  const last = days[days.length - 1] || '';
  return {
    first: froms[0] || '',
    okTwelve: firstAt(okN), okRun: runOf(okN), okNow: last ? okN(last) : 0,
    allTwelve: firstAt(allN), allRun: runOf(allN), allNow: last ? allN(last) : 0,
  };
}

/// 사람 × 날짜 표. 숫자 하나로는 왜 12명이 안 되는지 알 수 없다.
/// 칸이 차 있으면 그날 품앗이가 살아 있던 것, 진하면 그날 앱까지 연 것.
///
/// 표를 둘로 나눠 놨더니 같은 날짜를 두 번 훑어야 했다. 한 판에 붙이고
/// 아래쪽만 회색으로 둔다 — 합계는 두 줄(확인된 / 전체)로 준다.
function gridHtml(rows, appId) {
  if (!rows.length) return `<p class="muted">${t('hist_none')}</p>`;
  const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1)
    .padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const froms = rows.map(r => r.from_day).filter(Boolean).sort();
  const local = (s) => {
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);          // 로컬 자정
  };
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // 반려는 지우는 게 아니라 표시다 — 앞 기록은 그대로 두고 그 날에 금만 긋는다.
  const resets = (appId ? RESET.get(appId) : null) || [];
  const days = [];
  for (let d = froms.length ? local(froms[0]) : new Date(today);
       d <= today; d.setDate(d.getDate() + 1)) {
    days.push(key(d));
  }
  const shown = days.slice(-30);
  const todayKey = key(today);

  const on = (r, day) => {
    if (!r.from_day || day < r.from_day) return false;
    if (r.to_day && day >= r.to_day) return false;
    return true;
  };
  const mine = rows.filter(r => r.tracked);
  const theirs = rows.filter(r => !r.tracked);
  const okN = (d) => mine.filter(r => on(r, d)).length;
  const allN = (d) => rows.filter(r => on(r, d)).length;

  const head = `<tr><th class="grp"></th><th class="who"></th>${shown.map(d => {
    const [, m, dd] = d.split('-');
    return `<th class="${dd === '01' ? 'mstart ' : ''}${
      resets.includes(d) ? 'cut ' : ''}${
      d === todayKey ? 'now' : ''}">${dd === '01' ? m + '/' : ''}${+dd}</th>`;
  }).join('')}</tr>`;

  const line = (r, gcell, no) => {
    // ACT 를 안 쓰는 상대는 언제 그만뒀는지 우리가 알 수 없다. 내가 그 앱을
    // 마지막으로 연 날 이후는 '확인 안 됨'으로 흐리게 둔다 — 채워 두면
    // 살아 있는 줄 안다.
    const last = r.tracked ? null
      : (r.opened || []).length ? r.opened[r.opened.length - 1] : '';
    return `<tr class="${r.tracked ? '' : 'out'}">
    ${gcell || ''}
    <th class="who" title="${esc(r.who || '')}"><em class="gno">${no}</em>${
      iconHtml(r.icon, r.who || '?', 'gicon')}<span>${
      esc(r.app_name || r.who || '')}</span></th>
    ${shown.map(d => {
      const c = resets.includes(d) ? ' cut' : '';
      if (!on(r, d)) return `<td class="${c.trim()}"></td>`;
      if ((r.opened || []).includes(d)) return `<td class="hit${c}"></td>`;
      const stale = last !== null && d > last;
      return `<td class="keep${stale ? ' stale' : ''}${c}"></td>`;
    }).join('')}
  </tr>`;
  };

  // 오늘까지 이어지는 연속 일수 — 구글이 보는 게 그거다.
  // 표 전체를 훑는다(보이는 35일이 아니라).
  // 반려돼도 일수는 안 끊는다. 테스터는 그대로 남아 있고 구글이 보는 건
  // "신청 시점 기준 앞선 14일"이라, 반려는 다시 신청하는 일이지 옵트인을
  // 없애는 일이 아니다. 금은 언제 반려됐는지 보라고 긋는 것뿐이다.
  const runOf = (fn) => {
    let n = 0;
    for (let i = days.length - 1; i >= 0 && fn(days[i]) >= 12; i--) n++;
    return n;
  };
  const sum = (label, fn, cls) => `<tr class="sum ${cls}">
    <th class="grp"></th><th class="who">${label}
      <em class="run">${(() => {
        const n = runOf(fn);
        return n ? tf('grid_run', { n }) : t('grid_run0');
      })()}</em></th>
    ${shown.map(d => {
      const n = fn(d);
      return `<td class="${n >= 12 ? 'ok' : ''}${
        resets.includes(d) ? ' cut' : ''}">${n || ''}</td>`;
    }).join('')}</tr>`;

  /// 묶음 이름 — 첫 줄에 rowspan 으로 세워 둔다
  const gcell = (label, n) =>
    `<th class="grp" rowspan="${n}"><span>${label}
      <b>${n}</b></span></th>`;

  return `
    <p class="muted gnote">${t('grid_two')}</p>
    <p class="glegend">
      <span><i class="keep"></i>${t('grid_legend1')}</span>
      <span><i class="hit"></i>${t('grid_legend2')}</span>
      ${theirs.length ? `<span><i class="hit out"></i>${t('grid_legend2b')}</span>
      <span><i class="stale"></i>${t('grid_legend4')}</span>` : ''}
    </p>
    <div class="gwrap"><table class="gtab">
      <thead>${head}</thead>
      <tbody>
        <tr class="goal"><th class="grp"></th>
          <th class="who">${t('grid_goal')}</th>
          <td colspan="${shown.length}"></td></tr>
        ${sum(t('grid_sum_ok'), okN, 'ok-row')}
        ${theirs.length ? sum(t('grid_sum_all'), allN, 'all-row') : ''}
        ${mine.map((r, i) => line(r,
          i === 0 ? gcell(t('grid_tracked'), mine.length) : '', i + 1)).join('')}
        ${theirs.map((r, i) => line(r,
          i === 0 ? gcell(t('grid_untracked'), theirs.length) : '', i + 1)).join('')}
      </tbody>
    </table></div>
    ${theirs.length
      ? `<p class="muted gnote">${t('grid_untracked_p')}</p>` : ''}`;
}

/// 한글·일본어·한자는 두 칸을 차지한다
function wOf(s) {
  let w = 0;
  for (const ch of s) {
    const r = ch.codePointAt(0);
    w += (r >= 0x1100 && (r <= 0x115F || (r >= 0x2E80 && r <= 0xA4CF)
      || (r >= 0xAC00 && r <= 0xD7A3) || (r >= 0xF900 && r <= 0xFAFF)
      || (r >= 0xFE30 && r <= 0xFE6F) || (r >= 0xFF00 && r <= 0xFF60)
      || (r >= 0xFFE0 && r <= 0xFFE6))) ? 2 : 1;
  }
  return w;
}

/// 폭에 맞춰 접는다. 한글은 띄어쓰기가 드물어 단어 단위로만 접으면 넘친다.
function fold(s) {
  const out = []; let line = '';
  for (const word of s.split(' ')) {
    if (!line) line = word;
    else if (wOf(line) + 1 + wOf(word) <= COLS) line += ' ' + word;
    else { out.push(line); line = word; }
    while (wOf(line) > COLS) {
      let cut = 0, w = 0;
      for (; cut < line.length; cut++) {
        w += wOf(line[cut]);
        if (w > COLS) break;
      }
      out.push(line.slice(0, cut)); line = line.slice(cut);
    }
  }
  if (line) out.push(line);
  return out.length ? out : [''];
}

function prefixed(text, first, rest) {
  const out = [];
  for (const p of String(text).replace(/\r\n/g, '\n').split('\n')) {
    if (!p.trim()) { out.push(rest.trimEnd()); continue; }
    for (const line of fold(p.trim())) out.push((out.length ? rest : first) + line);
  }
  while (out.length && !out[0].trim()) out.shift();
  while (out.length && !out[out.length - 1].trim()) out.pop();
  return out.join('\n');
}
const quote = (s) => prefixed(s, '> ', '> ');
const bullet = (s) => prefixed(s, '- ', '  ');
const wrap = (s) => prefixed(s, '', '');

/// 두 칸짜리 표 — 뷰어가 없어도 세로줄이 맞도록 폭을 맞춰 둔다
function mdTable(head, rows) {
  const w = Math.max(...[head, ...rows].map(r => wOf(r[0])));
  const pad = (s) => s + ' '.repeat(w - wOf(s));
  const out = [`| ${pad(head[0])} | ${head[1]} |`, `| ${'-'.repeat(w)} | --- |`];
  for (const [k, v] of rows) out.push(`| ${pad(k)} | ${v} |`);
  return out.join('\n');
}

const ymd = (v) => {
  const d = new Date(v);
  return isNaN(d) ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1)
    .padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

  } finally { btn.disabled = false; btn.textContent = label; }

  const R = RPT[LANG] || RPT.en;
  const h = D.hist.find(x => x.app_id === appId) || {};
  const uid = user?.id;
  const mine = (f) => (f.replies || []).filter(r => r.author_id === uid);
  const fbs = D.fbIn.filter(f => f.app_id === appId)
    .slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const vsorted = vers.slice()
    .sort((a, b) => new Date(a.first_seen) - new Date(b.first_seen));

  const times = [...recs.map(x => x.at), ...fbs.map(f => f.created_at)]
    .filter(Boolean).map(x => new Date(x).getTime()).filter(x => !isNaN(x))
    .sort((a, b) => a - b);
  const span = times.length
    ? `${ymd(times[0])} ~ ${ymd(times[times.length - 1])} (${R.days(
        Math.round((times[times.length - 1] - times[0]) / 86400000) + 1)})`
    : '—';

  // 표와 같은 계산(로컬 날짜) — 서버는 UTC 로 오늘을 잡아 하루 어긋난다
  const g = gridStats(grid);
  const party = h.party_testers ?? 0, trades = h.trade_count ?? 0;
  const people = party + trades, chats = h.chat_count ?? 0;
  const repliedN = fbs.filter(f => mine(f).length).length;

  // 버전 구간에 피드백을 넣는다. 마지막 버전은 끝이 없다.
  const bucket = vsorted.map((v, i) => ({
    v, from: new Date(v.first_seen).getTime(),
    to: i + 1 < vsorted.length
      ? new Date(vsorted[i + 1].first_seen).getTime() : Infinity,
    items: [],
  }));
  const orphans = [];
  for (const f of fbs) {
    // 앱에서 보낸 피드백은 그때 쓰던 버전이 실려 온다 — 추측할 필요가 없다
    const tagged = f.app_version
      && bucket.find(x => x.v.version === f.app_version);
    if (tagged) { tagged.items.push(f); continue; }
    const at = new Date(f.created_at).getTime();
    const b = bucket.find(x => at >= x.from && at < x.to);
    (b ? b.items : orphans).push(f);
  }

  // 남의 말은 인용으로 감싼다. 내 답변과 섞이면 누가 한 말인지 흐려진다.
  const entry = (f) => {
    const who = f.author_name || '';
    const out = [`**${ymd(f.created_at)}${who ? ` · ${who}` : ''}**`, '',
                 quote(f.body || ''), ''];
    for (const r of mine(f)) out.push(`↳ **${R.reply}**`, '', quote(r.body || ''), '');
    return out;
  };

  const L = [];
  L.push(`# ${h.app_name || ''} — ${R.report}`, '');
  if (h.package_name) L.push('`' + h.package_name + '`', '');

  let no = 1;
  L.push(`## ${no}. ${R.summary}`, '');
  L.push(quote(R.basis + ' ' + R.basis2), '');
  L.push(mdTable([R.item, R.value], [
    [R.period, span],
    [R.start, g.first || '—'],
    [R.twelve, g.okTwelve || R.notyet],
    [R.streak, R.days(g.okRun)],
    [R.last, R.ppl(g.okNow)],
    [`${R.allbasis} · ${R.twelve}`, g.allTwelve || R.notyet],
    [`${R.allbasis} · ${R.streak}`, R.days(g.allRun)],
    [`${R.allbasis} · ${R.last}`, R.ppl(g.allNow)],
    [R.testers, `${R.ppl(people)}  (${R.party} ${party} · ${R.trade} ${trades})`],
    [R.gdays, R.days(h.google_days ?? 0)],
    [R.fb, `${R.cnt(fbs.length)}  (${R.replied} ${repliedN})`],
    [R.chats, R.cnt(chats)],
  ]), '');

  if (bucket.length) {
    L.push(`## ${++no}. ${R.byver}`, '', quote(R.vernote), '');
    for (const b of bucket.slice().reverse()) {
      L.push(`### ${b.v.version || '?'}`
        + (b.v.version_code ? ` (${b.v.version_code})` : ''), '');
      L.push(`${R.vtesters} ${R.ppl(b.v.testers)} · ${ymd(b.v.first_seen)}${R.from}`
        + ` · ${R.vfb} ${R.cnt(b.items.length)}`, '');
      if (!b.items.length) L.push(R.nofb, '');
      else for (const f of b.items) L.push(...entry(f));
    }
  }
  if (orphans.length) {
    L.push(`## ${++no}. ${R.nover}`, '', quote(R.novernote), '');
    for (const f of orphans) L.push(...entry(f));
  }

  // 신청서 초안 — 사실만 채우고 나머지는 빈칸으로 둔다
  L.push(`## ${++no}. ${R.draft}`, '', quote(R.draftnote), '');
  L.push(`### Q. ${R.q1}`, '', wrap(R.a1(people)), '');
  L.push(`### Q. ${R.q2}`, '', wrap(R.a2(fbs.length, chats)), '');
  L.push(`### Q. ${R.q3}`, '');
  L.push(fbs.length ? fbs.slice(-5).map(f => bullet(f.body || '')).join('\n') : '-', '');
  L.push(`### Q. ${R.q4}`, '');
  const changes = fbs.flatMap(f => mine(f).map(r => r.body || ''));
  L.push(changes.length ? changes.slice(-5).map(bullet).join('\n')
    : wrap(R.a4blank), '');
  L.push('---', `${R.madeby} · ${ymd(Date.now())}`);

  showReport(h.app_name || 'report', L.join('\n'));
}

function showReport(name, text) {
  const box = document.createElement('div');
  box.className = 'lb';
  box.innerHTML = `
    <div class="rptbox" onclick="event.stopPropagation()">
      <p style="margin:0 0 4px;font-weight:800">${t('rpt_title')}</p>
      <p class="muted" style="margin:0 0 10px;font-size:12px">${t('rpt_why')}</p>
      <textarea class="rpttext" spellcheck="false"></textarea>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn sm" id="rcopy">${t('rpt_copy')}</button>
        <button class="btn ghost sm" id="rsave">${t('rpt_save')}</button>
        <button class="btn ghost sm" id="rclose"
          style="margin-left:auto">${t('rpt_close')}</button>
      </div>
    </div>`;
  box.querySelector('.rpttext').value = text;
  box.onclick = () => box.remove();
  document.body.appendChild(box);

  box.querySelector('#rclose').onclick = () => box.remove();
  box.querySelector('#rcopy').onclick = async (e) => {
    try { await navigator.clipboard.writeText(text); } catch (_) {
      box.querySelector('.rpttext').select();
      document.execCommand('copy');
    }
    e.target.textContent = t('rpt_copied');
  };
  box.querySelector('#rsave').onclick = () => {
    const url = URL.createObjectURL(
      new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name.replace(/[\\/:*?"<>|]/g, '_')}.md`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
}

// ---- 관리자 문의 ----
// 앱의 1:1 문의방과 같은 방(support_messages)이다. 여기서 보낸 글이
// 관리자 쪽 채팅으로 그대로 들어간다.
async function paneContact(pane) {
  pane.innerHTML = `<div class="card">
    <h2 style="font-size:17px;margin:0 0 4px">${t('contact_h')}</h2>
    <p class="muted" style="margin:0 0 12px">${t('contact_p')}</p>
    <div id="sup" class="msgs"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" id="sPic">${t('photo')}</button>
      <input type="file" id="sFile" accept="image/*" hidden>
      <input type="text" id="sText" placeholder="${t('contact_ph')}"
             style="flex:1;min-width:150px">
      <button class="btn sm" id="sSend">${t('send')}</button>
    </div></div>`;

  const box = document.getElementById('sup');
  const draw = (rows) => {
    box.innerHTML = rows.map(m => {
      const own = m.sender_id === uid;
      const at = new Date(m.created_at);
      return `<div class="mrow ${own ? 'own' : ''}">
        <div class="bubble ${own ? 'own' : ''}">
          ${m.image_url ? `<img src="${esc(m.image_url)}" class="mimg">` : ''}
          ${esc(m.body || '')}
          <span class="mt">${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}</span>
        </div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  };

  const rows = await supportMessages().catch(() => []);
  draw(rows);
  supportMarkRead();
  if (unwatch) { unwatch(); unwatch = null; }
  unwatch = watchSupport(uid, (r) => {
    if (!rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
  });

  const send = async () => {
    const el = document.getElementById('sText');
    const text = el.value.trim();
    if (!text) return;
    el.value = '';
    try {
      const r = await sendSupportMessage(text);
      if (r && !rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
    } catch (e) { alert(e.message); }
  };
  document.getElementById('sSend').onclick = send;
  document.getElementById('sText').addEventListener('keydown',
    (e) => { if (e.key === 'Enter') send(); });

  document.getElementById('sPic').onclick = () => document.getElementById('sFile').click();
  document.getElementById('sFile').onchange = async (ev) => {
    const f = ev.target.files?.[0];
    if (!f) return;
    ev.target.value = '';
    try {
      const url = await uploadImage('chat-images', f);
      const r = await sendSupportImage(url);
      if (r && !rows.some(x => x.id === r.id)) { rows.push(r); draw(rows); }
    } catch (e) { alert(e.message || e); }
  };
}

// ---- 앱 등록·수정 ----
// 등록은 이 서비스에서 제일 중요한 절차다. 링크 한 줄이 기본이고,
// 직접 입력은 그 아래에 접어 둔다.
function appForm(existing) {
  const a = existing || {};
  const pane = document.getElementById('pane');
  document.getElementById('formCard')?.remove();
  // 수정은 그 카드 자리에서 열려야 한다. 맨 위로 튀어 올라가면
  // 앱이 여러 개일 때 어느 앱을 고치는 중인지 알 수가 없다.
  const card = existing ? document.getElementById(`card-${a.id}`) : null;
  const put = (html) => {
    if (card) { card.style.display = 'none'; card.insertAdjacentHTML('afterend', html); }
    else pane.insertAdjacentHTML('afterbegin', html);
  };
  put(`
    <div class="card" id="formCard" style="margin-bottom:18px">
      <h2 style="font-size:18px;margin:0 0 14px">${existing ? t('edit') : t('reg_h')}</h2>

      <div class="seg" id="f_mode">
        <button type="button" data-mode="closed">${t('mode_closed')}</button>
        <button type="button" data-mode="live">${t('mode_live')}</button>
      </div>
      <p class="muted" id="f_modep" style="margin:8px 0 0"></p>

      <!-- 비공개 테스트: 테스터가 실제로 밟는 순서대로 그룹스 → 옵트인 → 스토어 -->
      <div data-only="closed">
        <label>${t('f_group')} <span class="muted">${t('optional_h')}</span></label>
        <div class="row">
          <input type="url" id="f_group" style="flex:1;min-width:190px"
                 value="${esc(a.google_group_url || '')}"
                 placeholder="https://groups.google.com/g/...">
          <button class="btn ghost sm" id="f_gchk">${t('grp_check')}</button>
        </div>
        <p class="hint" id="f_gmsg"></p>

        <label>${t('f_optin')} <span class="req">${t('req')}</span></label>
        <input type="url" id="f_optin" value="${esc(a.opt_in_url || '')}"
               placeholder="https://play.google.com/apps/testing/com.example.app">
      </div>

      <label>${t('f_store')} <span class="muted" data-only="closed">${t('optional_h')}</span></label>
      <div class="row">
        <input type="text" id="f_store" style="flex:1;min-width:190px"
               value="${esc(a.package_name || '')}">
        <button class="btn sky sm" id="f_fetch">${t('fetch')}</button>
      </div>
      <div id="f_prev">${a.icon_url || a.name ? `<div class="app-card" style="margin-top:12px">
        ${iconHtml(a.icon_url, a.name || '?')}
        <div style="min-width:0"><p class="app-name">${esc(a.name || '')}</p>
          <p class="muted">${esc(a.package_name || '')}</p></div></div>` : ''}</div>

      <label>${t('f_name')} <span class="req">${t('req')}</span></label>
      <input type="text" id="f_name" value="${esc(a.name || '')}">

      <label>${t('f_desc')} <span class="muted">${t('optional_h')}</span></label>
      <textarea id="f_desc" rows="2" maxlength="100">${esc(a.description || '')}</textarea>

      <label>${t('f_long')} <span class="muted">${t('optional_h')}</span></label>
      <p class="hint" style="margin:0 0 6px">${t('f_long_p')}</p>
      <textarea id="f_long" rows="5" maxlength="2000">${esc(a.long_description || '')}</textarea>

      <label>${t('f_shot')} <span class="muted">${t('optional_h')}</span></label>
      <p class="hint" style="margin:0 0 6px">${t('f_shot_p')}</p>
      <div class="row">
        <button class="btn ghost sm" id="f_pick">${t('f_pick')}</button>
        <button class="btn ghost sm" id="f_drop" ${a.screenshot_url ? '' : 'hidden'}>${t('f_remove')}</button>
        <input type="file" id="f_file" accept="image/*" hidden>
      </div>
      <div id="f_shotbox">${a.screenshot_url
        ? `<img class="shot" src="${esc(a.screenshot_url)}" alt="">` : ''}</div>

      <p class="muted" style="margin:12px 0 0;font-size:12px">${t('reg_pick_p')}</p>

      <div class="note warn" style="margin-top:14px">${t('all_countries_warn')}</div>

      <div class="row" style="margin-top:16px">
        <button class="btn" id="f_save">${existing ? t('save') : t('register_app')}</button>
        <button class="btn ghost" id="f_cancel">${t('cancel')}</button>
      </div>
    </div>`);

  const $ = (id) => document.getElementById(id);

  // 사진은 한 장만. 여러 장이면 고르고 정렬하는 화면이 또 필요해진다.
  let shot = a.screenshot_url || '';
  $('f_pick').onclick = () => $('f_file').click();
  $('f_drop').onclick = () => {
    shot = '';
    $('f_shotbox').innerHTML = '';
    $('f_drop').hidden = true;
  };
  $('f_file').onchange = async () => {
    const f = $('f_file').files?.[0];
    if (!f) return;
    $('f_shotbox').innerHTML = '<p class="hint">…</p>';
    try {
      shot = await uploadShot(f);
      $('f_shotbox').innerHTML = `<img class="shot" src="${esc(shot)}" alt="">`;
      $('f_drop').hidden = false;
    } catch (_) {
      shot = '';
      $('f_shotbox').innerHTML = `<p class="hint bad">${t('upload_fail')}</p>`;
    }
    $('f_file').value = '';
  };

  // 비공개 테스트냐 출시된 앱이냐로 넣을 링크가 완전히 다르다.
  // 비공개 테스트 앱은 스토어 페이지가 404 라 자동 채우기가 안 된다.
  let mode = a.released_at ? 'live' : 'closed';
  const setMode = (m) => {
    mode = m;
    $('f_mode').querySelectorAll('[data-mode]').forEach(b =>
      b.classList.toggle('on', b.dataset.mode === m));
    $('f_modep').textContent = t(m === 'live' ? 'reg_p_live' : 'reg_p_closed');
    $('f_store').placeholder = 'https://play.google.com/store/apps/details?id=com.example.app';
    $('formCard').querySelectorAll('[data-only="closed"]').forEach(el => {
      el.style.display = m === 'closed' ? '' : 'none';
    });
  };
  $('f_mode').querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => setMode(b.dataset.mode);
  });
  setMode(mode);

  $('formCard').scrollIntoView({ block: 'nearest' });
  $('f_cancel').onclick = async () => {
    $('formCard').remove();
    if (card) card.style.display = '';
    // 앱이 하나도 없는 채로 닫으면 아무것도 못 하는 계정이 된다 — 한 번 붙잡는다
    if (!existing && noApps()) {
      const again = await ask({ h: t('reg_skip_h'), p: t('reg_skip_p'),
                               ok: t('reg_skip_go'), no: t('reg_skip_no') });
      if (again) appForm(null);
    }
  };

  const fetchNow = async () => {
    const pkg = pkgFromUrl($('f_store').value.trim());
    if (!pkg) { $('f_prev').innerHTML = `<p class="hint">${t('bad_link')}</p>`; return; }
    $('f_prev').innerHTML = '<p class="hint">…</p>';
    try {
      const m = await fetchStoreMeta(pkg);
      if (m?.name) $('f_name').value = m.name;
      if (m?.description) $('f_desc').value = m.description.slice(0, 100);
      $('f_store').value = pkg;
      if (!$('f_optin').value) $('f_optin').value = `https://play.google.com/apps/testing/${pkg}`;
      $('f_fetch').dataset.icon = m?.icon || '';
      $('f_prev').innerHTML = `<div class="app-card" style="margin-top:12px">
        ${iconHtml(m?.icon, m?.name || pkg)}
        <div style="min-width:0"><p class="app-name">${esc(m?.name || pkg)}</p>
          <p class="muted">${esc(pkg)}</p></div></div>`;
    } catch (_) {
      // 비공개 테스트면 스토어에 없는 게 정상이다. 패키지명만 챙기고 넘어간다.
      $('f_store').value = pkg;
      if (!$('f_optin').value) $('f_optin').value = `https://play.google.com/apps/testing/${pkg}`;
      $('f_prev').innerHTML = mode === 'live'
        ? `<p class="hint bad">${t('fetch_fail')}</p>`
        : `<p class="hint ok">✓ ${esc(pkg)}</p>`;
    }
  };
  // 그룹이 밖에서 보이는지는 주인 눈으로는 절대 확인이 안 된다.
  // 익명으로 한 번 열어보고 알려준다.
  const groupNow = async () => {
    const v = $('f_group').value.trim();
    if (!v) { $('f_gmsg').textContent = ''; return; }
    $('f_gmsg').textContent = '…';
    try {
      const r = await checkGroup(v);
      $('f_gmsg').className = 'hint ' + (r?.ok ? 'ok' : 'bad');
      $('f_gmsg').innerHTML = r?.ok ? `✓ ${esc(r.title)} — ${t('grp_ok')}` : `⚠ ${t('grp_bad')}`;
    } catch (_) { $('f_gmsg').textContent = ''; }
  };
  $('f_gchk').onclick = groupNow;
  $('f_group').addEventListener('blur', groupNow);
  if (a.google_group_url) groupNow();

  $('f_fetch').onclick = fetchNow;
  $('f_store').addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchNow(); });
  // 붙여넣기만 해도 알아서 가져온다 — 버튼을 한 번 더 누르게 하지 않는다
  $('f_store').addEventListener('paste', () => setTimeout(fetchNow, 30));

  $('f_save').onclick = async (ev) => {
    const name = $('f_name').value.trim();
    if (!name) { $('f_name').focus(); alert(t('need_name')); return; }
    const pkg = pkgFromUrl($('f_store').value) || pkgFromUrl($('f_optin').value) || null;
    if (!pkg) { $('f_optin').focus(); alert(t('need_optin')); return; }
    ev.target.disabled = true;
    try {
      await saveApp({
        id: a.id, name,
        description: $('f_desc').value.trim(),
        long_description: $('f_long').value.trim(),
        screenshot_url: shot,
        package_name: pkg,
        google_group_url: $('f_group').value.trim(),
        opt_in_url: $('f_optin').value.trim() ||
          (pkg ? `https://play.google.com/apps/testing/${pkg}` : ''),
        icon_url: $('f_fetch').dataset.icon || a.icon_url || '',
        is_public: a.is_public !== false,
      });
      await load(); tab = 'apps'; render();
      // 등록만 하고 앱을 안 깔면 인증이 0으로 남는다 — 그 자리에서 알려 준다
      if (!D.prof?.usage_access) regDone();
    } catch (e) { alert(e.message || e); ev.target.disabled = false; }
  };
}
</script>
</body>
</html>
